<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APRS Digipeater</title>
  <!-- Vendored locally (no CDN): see web/static/maplibre/ and
       first_run.html's Map caching step, which uses the exact same
       MapLibre + PMTiles setup this page reuses for the home-location map. -->
  <link rel="stylesheet" href="/static/maplibre/maplibre-gl.css">
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1416;
      --panel: #161d20;
      --panel-2: #1c2427;
      --border: #263238;
      --text: #e8edee;
      --muted: #8a9ba0;
      --accent: #4fb3a9;
      --success: #5fbf8e;
      --error: #e08585;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f6;
        --panel: #ffffff;
        --panel-2: #f0f3f3;
        --border: #dde3e3;
        --text: #1a2226;
        --muted: #62726f;
        --accent: #2e8b7f;
        --success: #2e8b57;
        --error: #b03a3a;
      }
    }

    * { box-sizing: border-box; }

    /* !important: otherwise an ID selector like #map-unavailable's own
       display:flex below (or any later-declared single-class rule at a
       specificity tie, e.g. .field-row's display:flex) would beat this
       regardless of source order, silently un-hiding the element. A
       "hidden" utility class needs to always win. */
    .hidden { display: none !important; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app {
      display: flex;
      height: 100%;
      width: 100%;
    }

    #sidebar {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
    }

    #map-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #dashboard-map {
      position: absolute;
      inset: 0;
    }

    #map-unavailable {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: var(--muted);
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card h2 {
      font-size: 11px;
      margin: 0 0 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .heard-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .heard-row:last-child { border-bottom: none; }
    .heard-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 4px;
      background: var(--panel);
      overflow: hidden;
    }
    .heard-call { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .heard-count { color: var(--muted); font-size: 11px; }
    .heard-time { color: var(--muted); font-size: 11px; width: 56px; text-align: right; flex-shrink: 0; }

    .station-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .station-symbol {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .station-callsign {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .station-comment {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.on {
      color: var(--accent);
      border-color: var(--accent);
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      padding: 3px 0;
    }
    .kv .k { color: var(--muted); }
    .kv .v { text-align: right; }

    .note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .msg {
      font-size: 12px;
      margin: 6px 0 0;
      min-height: 0;
    }
    .msg:empty { margin: 0; }
    .msg.error { color: var(--error); }

    .btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      flex: 1;
    }
    .btn:hover { border-color: var(--accent); }

    .auth-row {
      display: flex;
      gap: 8px;
      /* Pinned to the bottom of the flex-column sidebar, whatever the
         card content above adds up to. */
      margin-top: auto;
      padding-top: 16px;
    }

    button.badge {
      font-family: inherit;
      cursor: pointer;
    }
    button.badge:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    /* Not folded into .hidden{display:none} directly: a plain .hidden
       rule and this one would tie on specificity, and whichever is
       declared later in the stylesheet would win regardless of which is
       actually applied last in markup. Scoping the "show" state to
       :not(.hidden) instead sidesteps that entirely. */
    .modal-overlay:not(.hidden) { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 320px;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    #sidebar-toggle {
      display: none;
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 720px) {
      #sidebar-toggle { display: block; }
      #sidebar {
        position: absolute;
        z-index: 9;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.3);
      }
      #sidebar.open { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="card" id="station-card">
        <div class="station-header">
          <div class="station-symbol" id="station-symbol"></div>
          <div>
            <div class="station-callsign" id="station-callsign">-</div>
          </div>
        </div>
        <div class="station-comment" id="station-comment"></div>
        <div class="badge-row" id="station-badges"></div>
        <p class="msg" id="direwolf-msg"></p>
      </div>

      <div class="card">
        <h2 id="gps-title">GPS</h2>
        <div id="gps-body"><div class="note">Checking…</div></div>
      </div>

      <div class="card" id="beacon-stats-card">
        <h2>Beacon stats</h2>
        <div id="beacon-stats-body"></div>
      </div>

      <div class="card">
        <h2>Heard stations</h2>
        <div id="heard-list"></div>
      </div>

      <div class="auth-row">
        <button type="button" id="btn-config" class="btn hidden">Config</button>
        <button type="button" id="btn-login" class="btn hidden">Log in</button>
        <button type="button" id="btn-logout" class="btn hidden">Log out</button>
      </div>
    </aside>

    <button type="button" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>

    <main id="map-wrap">
      <div id="dashboard-map"></div>
      <div id="map-unavailable" class="hidden">
        <div>
          <p>No map data cached yet.</p>
          <p class="note">Run the installer, or check the Map caching step during setup.</p>
        </div>
      </div>
    </main>

    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="card modal-box">
        <p id="confirm-modal-text"></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="confirm-modal-cancel">Cancel</button>
          <button type="button" class="btn" id="confirm-modal-ok">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/maplibre/maplibre-gl.js"></script>
  <script src="/static/maplibre/pmtiles.js"></script>
  <script>
    // ── APRS symbol glyph rendering ──────────────────────────────────
    // Same sprite sheet / cell math as first_run.html's symbol picker
    // (web/static/aprs-symbols/, hessu/aprs-symbols, CC BY-SA 4.0),
    // display-only here, no picker interactivity needed.
    const SPRITE_CELL_W = 64;
    const SPRITE_CELL_H = 64;
    const SPRITE_SHEET_W = 1024;
    const SPRITE_SHEET_H = 384;
    const SPRITE_BASE = '/static/aprs-symbols/';

    function symbolGlyphHTML(sym, displayW) {
      const sheet = sym.table === '\\' ? 'sheet1.png' : 'sheet0.png';
      const code = sym.symbol.charCodeAt(0) - 0x21;
      const col = code % 16;
      const row = Math.floor(code / 16);
      const scale = displayW / SPRITE_CELL_W;
      const displayH = Math.round(SPRITE_CELL_H * scale);
      const bgW = Math.round(SPRITE_SHEET_W * scale);
      const bgH = Math.round(SPRITE_SHEET_H * scale);
      const bgX = -Math.round(col * SPRITE_CELL_W * scale);
      const bgY = -Math.round(row * SPRITE_CELL_H * scale);
      // display:inline-block + flex-shrink:0: a bare <span> is
      // display:inline, so width/height are spec-ignored entirely unless
      // something blockifies it: which happened to work by accident
      // wherever the parent was itself display:flex (e.g. .station-symbol),
      // but left the icon at 0x0 (invisible) in a plain block parent like
      // .heard-icon or the map markers below. Even where it did get
      // blockified via a flex parent, the default flex-shrink:1 let a
      // parent's own border (with global box-sizing:border-box eating into
      // its content box) squish the icon a couple pixels narrower than
      // tall, a real visible misalignment: confirmed both bugs live via
      // Playwright (getComputedStyle/bounding boxes), not just by reading
      // the CSS.
      const style = `display:inline-block;flex-shrink:0;width:${displayW}px;height:${displayH}px;background-image:url('${SPRITE_BASE}${sheet}');background-repeat:no-repeat;background-size:${bgW}px ${bgH}px;background-position:${bgX}px ${bgY}px;`;
      return `<span style="${style}"></span>`;
    }

    // ── Sidebar toggle (narrow viewports) ────────────────────────────
    const sidebar = document.getElementById('sidebar');
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // ── Station card ──────────────────────────────────────────────────
    function renderStationCard(cfg) {
      const aprs = cfg.aprs || {};
      const sym = (aprs.symbol && aprs.symbol.table && aprs.symbol.symbol)
        ? aprs.symbol
        : { table: '/', symbol: '#' };
      document.getElementById('station-symbol').innerHTML = symbolGlyphHTML(sym, 40);
      document.getElementById('station-callsign').textContent =
        aprs.callsign ? `${aprs.callsign}${aprs.ssid ? '-' + aprs.ssid : ''}` : 'Callsign not set';
      document.getElementById('station-comment').textContent = aprs.comment || '';

      const badges = [];
      if (aprs.digipeat_mode === 'digipeater') {
        const rules = (aprs.digipeat && aprs.digipeat.rules) || '';
        const label = rules === 'widearea' ? 'Digipeat: Wide-area' : rules === 'fillin' ? 'Digipeat: Fill-in' : 'Digipeat: Custom';
        badges.push(`<span class="badge on">${label}</span>`);
      } else {
        badges.push(`<span class="badge">Digipeat: RX only</span>`);
      }
      const igateLabels = { off: 'IGate: Off', rxonly: 'IGate: RX only', rxtx: 'IGate: RX &amp; TX' };
      const igateOn = (aprs.igate_mode || 'off') !== 'off';
      badges.push(`<span class="badge${igateOn ? ' on' : ''}">${igateLabels[aprs.igate_mode] || 'IGate: Off'}</span>`);
      document.getElementById('station-badges').innerHTML = badges.join('');
    }

    // ── GPS card ──────────────────────────────────────────────────────
    // The one sidebar section backed by real data: services/gps.py's
    // gpsd client already reports fix/satellites/position live, nothing
    // here is a placeholder.
    let gpsPollTimer = null;
    let lastGpsUpdateAt = null;
    const GPS_POLL_MS = 5000;

    function timeSinceLabel(date) {
      const s = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m}m ago`;
      return `${Math.round(m / 60)}h ago`;
    }

    function renderGpsBody(gpsCfg, status) {
      const title = document.getElementById('gps-title');
      const body = document.getElementById('gps-body');
      if (gpsCfg.position_source === 'manual') {
        title.textContent = 'GPS: Manual';
        const hasPos = gpsCfg.latitude !== undefined && gpsCfg.longitude !== undefined && gpsCfg.latitude !== '' && gpsCfg.longitude !== '';
        const pos = hasPos ? `${parseFloat(gpsCfg.latitude).toFixed(5)}, ${parseFloat(gpsCfg.longitude).toFixed(5)}` : '-';
        body.innerHTML = `<div class="kv"><span class="k">Position</span><span class="v">${pos}</span></div>`;
        return;
      }
      title.textContent = 'GPS: Live';
      if (!status || !status.available) {
        body.innerHTML = `<div class="note">${(status && status.reason) || 'GPS not available.'}</div>`;
        return;
      }
      const pos = status.has_fix ? `${status.latitude.toFixed(5)}, ${status.longitude.toFixed(5)}` : 'No fix yet';
      lastGpsUpdateAt = new Date();
      body.innerHTML = `
        <div class="kv"><span class="k">Position</span><span class="v">${pos}</span></div>
        <div class="kv"><span class="k">Fix</span><span class="v">${status.fix}</span></div>
        <div class="kv"><span class="k">Signal</span><span class="v">${status.satellites_used ?? '-'} / ${status.satellites_visible ?? '-'} sats</span></div>
        <div class="kv"><span class="k">Last update</span><span class="v">${timeSinceLabel(lastGpsUpdateAt)}</span></div>
      `;
    }

    // ── Auth (login/config/logout buttons, and gating the Direwolf
    // control below) ─────────────────────────────────────────────────
    // Populated once at boot from /api/auth/status: see the boot IIFE.
    // mode 'full' never actually shows this page logged-out at all
    // (server.py's root() redirects to /login first), so the only
    // logged-out case this page itself ever has to render is 'readonly'.
    let authState = { mode: 'none', logged_in: false };

    function renderAuthControls() {
      const canConfig = authState.mode === 'none' || authState.logged_in;
      const showLogin = authState.mode !== 'none' && !authState.logged_in;
      const showLogout = authState.mode !== 'none' && authState.logged_in;
      document.getElementById('btn-config').classList.toggle('hidden', !canConfig);
      document.getElementById('btn-login').classList.toggle('hidden', !showLogin);
      document.getElementById('btn-logout').classList.toggle('hidden', !showLogout);
    }

    document.getElementById('btn-config').addEventListener('click', () => { location.href = '/config'; });
    document.getElementById('btn-login').addEventListener('click', () => { location.href = '/login'; });
    document.getElementById('btn-logout').addEventListener('click', async () => {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } finally {
        location.reload();
      }
    });

    // ── Confirm modal (used only when there's no login gate already
    // acting as an "are you sure": see toggleDirewolf below) ──────────
    function confirmModal(text) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('confirm-modal');
        const okBtn = document.getElementById('confirm-modal-ok');
        const cancelBtn = document.getElementById('confirm-modal-cancel');
        document.getElementById('confirm-modal-text').textContent = text;
        overlay.classList.remove('hidden');
        function cleanup(result) {
          overlay.classList.add('hidden');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          resolve(result);
        }
        function onOk() { cleanup(true); }
        function onCancel() { cleanup(false); }
        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
      });
    }

    // ── Direwolf status/control badge, living in the station card's own
    // badge row next to Digipeat/IGate (no separate "System status" card
    // anymore). No systemd service exists yet (see TODO.md's
    // direwolf.conf generator gap), so services/system.py honestly
    // reports "not set up" until it does; this just displays and acts on
    // whatever that says. ────────────────────────────────────────────
    async function toggleDirewolf(status) {
      const wantRunning = !status.running;
      // A login was already required to reach this control at all under
      // readonly/full (see the disabled state below); that in itself is
      // the "are you sure", so only mode 'none' (no gate at all) also
      // needs a confirm modal as its own safety net against a stray click.
      if (authState.mode === 'none') {
        const ok = await confirmModal(`${wantRunning ? 'Start' : 'Stop'} Direwolf?`);
        if (!ok) return;
      }
      const msg = document.getElementById('direwolf-msg');
      msg.textContent = '';
      msg.className = 'msg';
      try {
        const res = await fetch(`/api/system/direwolf/${wantRunning ? 'start' : 'stop'}`, { method: 'POST' });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          msg.textContent = body.detail || 'Failed to change Direwolf state.';
          msg.className = 'msg error';
        }
      } catch (e) {
        msg.textContent = 'Could not reach the server.';
        msg.className = 'msg error';
      }
      renderSystemStatusBody();
    }

    async function renderSystemStatusBody() {
      const badgeRow = document.getElementById('station-badges');
      // Idempotent: drop any previous Direwolf badge before appending a
      // fresh one, since this re-runs after every start/stop (see
      // toggleDirewolf above) as well as once at boot.
      const existing = document.getElementById('direwolf-toggle');
      if (existing) existing.remove();

      let status;
      try {
        status = await (await fetch('/api/system/direwolf/status')).json();
      } catch (e) {
        return; // one missing badge isn't worth a dedicated error state
      }
      const canControl = authState.mode === 'none' || authState.logged_in;
      // "simulated" means there's no real direwolf.service to ask/control
      // yet (see services/system.py): an in-memory stand-in so this
      // control's UX (confirm modal, login gating, badge state) can
      // actually be clicked through and tested. Labelled, not hidden, so
      // it's never mistaken for real control once a real service exists.
      const label = 'Direwolf: ' + (status.running ? 'Running' : 'Stopped') + (status.simulated ? ' (sim)' : '');
      const title = status.simulated ? 'No direwolf.service installed yet. This toggles an in-memory simulated state for UI testing only.' : '';
      const badgeClass = `badge${status.running ? ' on' : ''}`;
      badgeRow.insertAdjacentHTML('beforeend', `<button type="button" class="${badgeClass}" id="direwolf-toggle" title="${title}" ${!canControl ? 'disabled' : ''}>${label}</button>`);
      if (canControl) {
        document.getElementById('direwolf-toggle').addEventListener('click', () => toggleDirewolf(status));
      }
    }

    // ── Beacon stats card (sample data: no packet source exists yet to
    // report real transmit times from) ──────────────────────────────────
    function renderBeaconStatsBody(cfg) {
      const card = document.getElementById('beacon-stats-card');
      const aprs = cfg.aprs || {};
      if (!aprs.callsign) {
        card.classList.add('hidden');
        return;
      }
      card.classList.remove('hidden');
      document.getElementById('beacon-stats-body').innerHTML = `
        <div class="kv"><span class="k">Last beacon</span><span class="v">2m ago</span></div>
        <div class="kv"><span class="k">Next beacon</span><span class="v">in 8m</span></div>
      `;
    }

    // ── Heard stations card (sample data: no packet source exists yet to
    // list real heard stations from) ─────────────────────────────────────
    // dLat/dLon are small offsets from the home point, not absolute
    // coordinates; the home point itself isn't known until config/GPS
    // has loaded (see initDashboardMap), so sample markers are placed
    // relative to wherever that ends up being, not hardcoded to one spot.
    const SAMPLE_HEARD_STATIONS = [
      { callsign: 'ZL1ABC-9', symbol: { table: '/', symbol: '>' }, count: 14, seconds_ago: 180, dLat: 0.03, dLon: 0.02 },
      { callsign: 'ZL2XYZ', symbol: { table: '/', symbol: '#' }, count: 47, seconds_ago: 720, dLat: -0.015, dLon: 0.04 },
      { callsign: 'ZL3DEF-7', symbol: { table: '/', symbol: '[' }, count: 2, seconds_ago: 3600, dLat: -0.025, dLon: -0.03 },
    ];

    function renderHeardStations() {
      const list = document.getElementById('heard-list');
      if (SAMPLE_HEARD_STATIONS.length === 0) {
        list.innerHTML = `<div class="note">No stations heard yet.</div>`;
        return;
      }
      list.innerHTML = SAMPLE_HEARD_STATIONS.map(s => `
        <div class="heard-row">
          <span class="heard-icon">${symbolGlyphHTML(s.symbol, 20)}</span>
          <span class="heard-call">${s.callsign}</span>
          <span class="heard-count">×${s.count}</span>
          <span class="heard-time">${timeSinceLabel(new Date(Date.now() - s.seconds_ago * 1000))}</span>
        </div>
      `).join('');
    }

    // ── Home-location map ─────────────────────────────────────────────
    async function initDashboardMap(cfg, worldAvailable, regionAvailable) {
      const mapUnavailable = document.getElementById('map-unavailable');
      if (!worldAvailable && !regionAvailable) {
        mapUnavailable.classList.remove('hidden');
        return;
      }

      // Home point: manual position wins outright (it's exact and static);
      // otherwise a live GPS fix; otherwise the center of the region
      // picked during setup (still roughly "home", since that's what it
      // was centered on); otherwise nothing to show a marker at.
      let homeLat = null, homeLon = null;
      const gpsCfg = cfg.gps || {};
      const mapCfg = cfg.map || {};
      if (gpsCfg.position_source === 'manual' && gpsCfg.latitude && gpsCfg.longitude) {
        homeLat = parseFloat(gpsCfg.latitude);
        homeLon = parseFloat(gpsCfg.longitude);
      } else {
        try {
          const res = await fetch('/api/gps/position');
          const data = await res.json();
          if (data.available) {
            homeLat = data.latitude;
            homeLon = data.longitude;
          }
        } catch (e) {
          // Falls through to the region-center fallback below.
        }
      }
      if (homeLat === null && mapCfg.north !== undefined && mapCfg.south !== undefined) {
        homeLat = (parseFloat(mapCfg.north) + parseFloat(mapCfg.south)) / 2;
        homeLon = (parseFloat(mapCfg.east) + parseFloat(mapCfg.west)) / 2;
      }
      const center = [homeLon ?? 0, homeLat ?? 0];

      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);

      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const styleUrl = `/static/maplibre/style-${prefersDark ? 'dark' : 'light'}.json`;
      const style = await (await fetch(styleUrl)).json();
      // Region data is finer detail (higher max zoom, user-picked bounds)
      // than the coarse whole-world precache; prefer it when available.
      const pmtilesFile = regionAvailable ? 'region.pmtiles' : 'world.pmtiles';
      style.sources.protomaps.url = `pmtiles://${location.origin}/map-data/${pmtilesFile}`;

      const map = new maplibregl.Map({
        container: 'dashboard-map',
        style,
        center,
        zoom: homeLat !== null ? 12 : 1,
      });
      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      await new Promise(resolve => map.on('load', resolve));

      if (homeLat !== null) {
        const el = document.createElement('div');
        el.style.cssText = 'width:40px;height:40px;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.5));';
        const aprs = cfg.aprs || {};
        const sym = (aprs.symbol && aprs.symbol.table && aprs.symbol.symbol) ? aprs.symbol : { table: '/', symbol: '#' };
        el.innerHTML = symbolGlyphHTML(sym, 40);
        new maplibregl.Marker({ element: el }).setLngLat(center).addTo(map);

        // Same sample data as the Heard stations sidebar card, plotted
        // nearby (see SAMPLE_HEARD_STATIONS' dLat/dLon): confirms the
        // whole icon-rendering pipeline works for more than just the one
        // home marker, ahead of a real packet source existing to place
        // these from real heard-station positions instead.
        for (const s of SAMPLE_HEARD_STATIONS) {
          const sEl = document.createElement('div');
          sEl.style.cssText = 'width:28px;height:28px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));';
          sEl.innerHTML = symbolGlyphHTML(s.symbol, 28);
          new maplibregl.Marker({ element: sEl })
            .setLngLat([homeLon + s.dLon, homeLat + s.dLat])
            .addTo(map);
        }
      }
    }

    // ── Boot ──────────────────────────────────────────────────────────
    (async () => {
      try {
        authState = await (await fetch('/api/auth/status')).json();
      } catch (e) {
        authState = { mode: 'none', logged_in: false };
      }
      renderAuthControls();

      let cfg = {};
      try {
        const res = await fetch('/api/config');
        if (res.ok) cfg = await res.json();
      } catch (e) {
        // Falls through: every card below handles a missing/partial cfg.
        // Under mode 'full' while logged out this 401s (see server.py's
        // get_config); unreachable in practice since root() would have
        // redirected to /login before this page's JS ever ran, but this
        // still degrades to an empty cfg rather than throwing either way.
      }

      renderStationCard(cfg);
      renderSystemStatusBody();
      renderBeaconStatsBody(cfg);
      renderHeardStations();

      const gpsCfg = cfg.gps || {};
      if (gpsCfg.position_source === 'manual') {
        renderGpsBody(gpsCfg, null);
      } else {
        async function pollGps() {
          try {
            const res = await fetch('/api/gps/status');
            renderGpsBody(gpsCfg, await res.json());
          } catch (e) {
            renderGpsBody(gpsCfg, { available: false, reason: 'Could not reach the server.' });
          }
        }
        await pollGps();
        gpsPollTimer = setInterval(pollGps, GPS_POLL_MS);
      }

      let worldAvailable = false, regionAvailable = false;
      try {
        worldAvailable = (await (await fetch('/api/map/world-status')).json()).available;
      } catch (e) {}
      try {
        regionAvailable = (await (await fetch('/api/map/region-status')).json()).available;
      } catch (e) {}

      initDashboardMap(cfg, worldAvailable, regionAvailable);
    })();
  </script>
</body>
</html>
