<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APRS Digipeater</title>
  <!-- Applied before the stylesheet below is parsed, so the page never
       paints in the wrong theme and then flips: see the matching
       :root[data-theme] rules in <style> and the theme-toggle wiring
       further down for how 'ui-theme' gets set. -->
  <script>
    (function() {
      var t = localStorage.getItem('ui-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <!-- Vendored locally (no CDN): see web/static/maplibre/ and
       first_run.html's Map caching step, which uses the exact same
       MapLibre + PMTiles setup this page reuses for the home-location map. -->
  <link rel="stylesheet" href="/static/maplibre/maplibre-gl.css">
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1416;
      --panel: #161d20;
      --panel-2: #1c2427;
      --border: #263238;
      --text: #e8edee;
      --muted: #8a9ba0;
      --accent: #4fb3a9;
      --success: #5fbf8e;
      --error: #e08585;
      --warn: #e0b155;
    }
    /* System preference, only when there's no explicit override below. */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f6f6;
        --panel: #ffffff;
        --panel-2: #f0f3f3;
        --border: #dde3e3;
        --text: #1a2226;
        --muted: #62726f;
        --accent: #2e8b7f;
        --success: #2e8b57;
        --error: #b03a3a;
        --warn: #b0791f;
      }
    }
    /* Explicit override via the theme toggle, wins over system preference
       in both directions. */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f6f6;
      --panel: #ffffff;
      --panel-2: #f0f3f3;
      --border: #dde3e3;
      --text: #1a2226;
      --muted: #62726f;
      --accent: #2e8b7f;
      --success: #2e8b57;
      --error: #b03a3a;
      --warn: #b0791f;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1416;
      --panel: #161d20;
      --panel-2: #1c2427;
      --border: #263238;
      --text: #e8edee;
      --muted: #8a9ba0;
      --accent: #4fb3a9;
      --success: #5fbf8e;
      --error: #e08585;
      --warn: #e0b155;
    }

    * { box-sizing: border-box; }

    /* !important: otherwise an ID selector like #map-unavailable's own
       display:flex below (or any later-declared single-class rule at a
       specificity tie, e.g. .field-row's display:flex) would beat this
       regardless of source order, silently un-hiding the element. A
       "hidden" utility class needs to always win. */
    .hidden { display: none !important; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app {
      display: flex;
      height: 100%;
      width: 100%;
    }

    #sidebar {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
    }

    #map-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #dashboard-map {
      position: absolute;
      inset: 0;
    }

    #map-unavailable {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: var(--muted);
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card h2 {
      font-size: 11px;
      margin: 0 0 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .heard-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .heard-row:last-child { border-bottom: none; }
    .heard-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 4px;
      background: var(--panel);
      overflow: hidden;
    }
    .heard-call { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .heard-count { color: var(--muted); font-size: 11px; }
    .heard-time { color: var(--muted); font-size: 11px; width: 56px; text-align: right; flex-shrink: 0; }

    .station-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* The callsign wrapper shrinks (and its text ellipsizes) before the
       badge does, so a long callsign never pushes the Direwolf badge off
       the edge of the sidebar or wraps it onto its own line. */
    .station-header > div:not(.station-symbol) {
      min-width: 0;
      flex-shrink: 1;
    }

    #direwolf-badge-slot {
      flex-shrink: 0;
    }

    .station-symbol {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .station-callsign {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .station-comment {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.on {
      color: var(--accent);
      border-color: var(--accent);
    }
    .badge.error {
      color: var(--error);
      border-color: var(--error);
    }
    .badge.pending {
      color: var(--warn);
      border-color: var(--warn);
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      padding: 3px 0;
    }
    .kv .k { color: var(--muted); }
    .kv .v { text-align: right; }

    .note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .msg {
      font-size: 12px;
      margin: 6px 0 0;
      min-height: 0;
    }
    .msg:empty { margin: 0; }
    .msg.error { color: var(--error); }

    .btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      flex: 1;
    }
    .btn:hover { border-color: var(--accent); }

    .auth-row {
      display: flex;
      gap: 8px;
      /* Pinned to the bottom of the flex-column sidebar, whatever the
         card content above adds up to. */
      margin-top: auto;
      padding-top: 16px;
    }

    button.badge {
      font-family: inherit;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    /* Not folded into .hidden{display:none} directly: a plain .hidden
       rule and this one would tie on specificity, and whichever is
       declared later in the stylesheet would win regardless of which is
       actually applied last in markup. Scoping the "show" state to
       :not(.hidden) instead sidesteps that entirely. */
    .modal-overlay:not(.hidden) { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 320px;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    #sidebar-toggle {
      display: none;
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 720px) {
      #sidebar-toggle { display: block; }
      #sidebar {
        position: absolute;
        z-index: 9;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.3);
      }
      #sidebar.open { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="card" id="station-card">
        <div class="station-header">
          <div class="station-symbol" id="station-symbol"></div>
          <div>
            <div class="station-callsign" id="station-callsign">-</div>
          </div>
          <div id="direwolf-badge-slot" style="margin-left:auto"></div>
        </div>
        <div class="station-comment" id="station-comment"></div>
        <div class="badge-row" id="station-badges"></div>
        <p class="msg" id="direwolf-msg"></p>
      </div>

      <div class="card">
        <h2 id="gps-title">GPS</h2>
        <div id="gps-body"><div class="note">Checking…</div></div>
      </div>

      <div class="card" id="beacon-stats-card">
        <h2>Beacon stats</h2>
        <div id="beacon-stats-body"></div>
      </div>

      <div class="card">
        <h2>Heard stations</h2>
        <div id="heard-list"></div>
      </div>

      <div class="auth-row">
        <button type="button" id="theme-toggle" class="btn" title="UI theme (independent of the map's own theme toggle, top-left on the map itself)"></button>
        <button type="button" id="btn-config" class="btn hidden">Config</button>
        <button type="button" id="btn-login" class="btn hidden">Log in</button>
        <button type="button" id="btn-logout" class="btn hidden">Log out</button>
      </div>
    </aside>

    <button type="button" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>

    <main id="map-wrap">
      <div id="dashboard-map"></div>
      <div id="map-unavailable" class="hidden">
        <div>
          <p>No map data cached, and no internet available to stream one.</p>
          <p class="note">Run the installer, check the Map caching step during setup, or connect the Pi to the internet.</p>
        </div>
      </div>
    </main>

    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="card modal-box">
        <p id="confirm-modal-text"></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="confirm-modal-cancel">Cancel</button>
          <button type="button" class="btn" id="confirm-modal-ok">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/maplibre/maplibre-gl.js"></script>
  <script src="/static/maplibre/pmtiles.js"></script>
  <script>
    // ── APRS symbol glyph rendering ──────────────────────────────────
    // Same sprite sheet / cell math as first_run.html's symbol picker
    // (web/static/aprs-symbols/, hessu/aprs-symbols, CC BY-SA 4.0),
    // display-only here, no picker interactivity needed.
    const SPRITE_CELL_W = 64;
    const SPRITE_CELL_H = 64;
    const SPRITE_SHEET_W = 1024;
    const SPRITE_SHEET_H = 384;
    const SPRITE_BASE = '/static/aprs-symbols/';

    function symbolGlyphHTML(sym, displayW) {
      const sheet = sym.table === '\\' ? 'sheet1.png' : 'sheet0.png';
      const code = sym.symbol.charCodeAt(0) - 0x21;
      const col = code % 16;
      const row = Math.floor(code / 16);
      const scale = displayW / SPRITE_CELL_W;
      const displayH = Math.round(SPRITE_CELL_H * scale);
      const bgW = Math.round(SPRITE_SHEET_W * scale);
      const bgH = Math.round(SPRITE_SHEET_H * scale);
      const bgX = -Math.round(col * SPRITE_CELL_W * scale);
      const bgY = -Math.round(row * SPRITE_CELL_H * scale);
      // display:inline-block + flex-shrink:0: a bare <span> is
      // display:inline, so width/height are spec-ignored entirely unless
      // something blockifies it: which happened to work by accident
      // wherever the parent was itself display:flex (e.g. .station-symbol),
      // but left the icon at 0x0 (invisible) in a plain block parent like
      // .heard-icon or the map markers below. Even where it did get
      // blockified via a flex parent, the default flex-shrink:1 let a
      // parent's own border (with global box-sizing:border-box eating into
      // its content box) squish the icon a couple pixels narrower than
      // tall, a real visible misalignment: confirmed both bugs live via
      // Playwright (getComputedStyle/bounding boxes), not just by reading
      // the CSS.
      const style = `display:inline-block;flex-shrink:0;width:${displayW}px;height:${displayH}px;background-image:url('${SPRITE_BASE}${sheet}');background-repeat:no-repeat;background-size:${bgW}px ${bgH}px;background-position:${bgX}px ${bgY}px;`;
      return `<span style="${style}"></span>`;
    }

    // ── Sidebar toggle (narrow viewports) ────────────────────────────
    const sidebar = document.getElementById('sidebar');
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // ── Station card ──────────────────────────────────────────────────
    function renderStationCard(cfg) {
      const aprs = cfg.aprs || {};
      const sym = (aprs.symbol && aprs.symbol.table && aprs.symbol.symbol)
        ? aprs.symbol
        : { table: '/', symbol: '#' };
      document.getElementById('station-symbol').innerHTML = symbolGlyphHTML(sym, 40);
      document.getElementById('station-callsign').textContent =
        aprs.callsign ? `${aprs.callsign}${aprs.ssid ? '-' + aprs.ssid : ''}` : 'Callsign not set';
      document.getElementById('station-comment').textContent = aprs.comment || '';

      const badges = [];
      if (aprs.digipeat_mode === 'digipeater') {
        const rules = (aprs.digipeat && aprs.digipeat.rules) || '';
        const suffix = rules === 'widearea' ? 'Wide' : rules === 'fillin' ? 'Fill in' : 'Custom';
        badges.push(`<span class="badge on">Digi: RX &amp; TX - ${suffix}</span>`);
      } else {
        badges.push(`<span class="badge">Digi: RX only</span>`);
      }
      const igateLabels = { off: 'IGate: Off', rxonly: 'IGate: RX only', rxtx: 'IGate: RX &amp; TX' };
      const igateOn = (aprs.igate_mode || 'off') !== 'off';
      badges.push(`<span class="badge${igateOn ? ' on' : ''}">${igateLabels[aprs.igate_mode] || 'IGate: Off'}</span>`);
      document.getElementById('station-badges').innerHTML = badges.join('');
    }

    // ── GPS card ──────────────────────────────────────────────────────
    // The one sidebar section backed by real data: services/gps.py's
    // gpsd client already reports fix/satellites/position live, nothing
    // here is a placeholder.
    let gpsPollTimer = null;
    let lastGpsUpdateAt = null;
    // Set by renderSystemStatusBody below (its own independent poll), read
    // by renderGpsBody so the GPS card can explain *why* it matters that
    // there's no fix yet, when that's specifically what a pending Direwolf
    // start is stuck waiting on (services/system.py's "waiting_gps" state).
    let lastDirewolfState = null;
    // Direwolf's "Starting"/"Stopping" states only exist for the duration
    // of a set_direwolf_running() call on the server (see services/
    // system.py's _transition), which this tab might not itself have
    // triggered (another tab's click, or main.py's own boot sequence):
    // polling, not just re-rendering after this tab's own click, is what
    // lets the badge actually show those live rather than jumping
    // straight from Standby to Running with nothing in between.
    const DIREWOLF_POLL_MS = 3000;
    const GPS_POLL_MS = 5000;

    function timeSinceLabel(date) {
      const s = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m}m ago`;
      return `${Math.round(m / 60)}h ago`;
    }

    function renderGpsBody(gpsCfg, status) {
      const title = document.getElementById('gps-title');
      const body = document.getElementById('gps-body');
      if (gpsCfg.position_source === 'manual') {
        title.textContent = 'GPS: Manual';
        const hasPos = gpsCfg.latitude !== undefined && gpsCfg.longitude !== undefined && gpsCfg.latitude !== '' && gpsCfg.longitude !== '';
        const pos = hasPos ? `${parseFloat(gpsCfg.latitude).toFixed(5)}, ${parseFloat(gpsCfg.longitude).toFixed(5)}` : '-';
        body.innerHTML = `<div class="kv"><span class="k">Position</span><span class="v">${pos}</span></div>`;
        return;
      }
      title.textContent = 'GPS: Live';
      if (!status || !status.available) {
        body.innerHTML = `<div class="note">${(status && status.reason) || 'GPS not available.'}</div>`;
        return;
      }
      const pos = status.has_fix ? `${status.latitude.toFixed(5)}, ${status.longitude.toFixed(5)}` : 'No fix yet';
      lastGpsUpdateAt = new Date();
      const waitingNote = (!status.has_fix && lastDirewolfState === 'waiting_gps')
        ? '<div class="note">Direwolf is waiting for this fix to start.</div>'
        : '';
      body.innerHTML = `
        <div class="kv"><span class="k">Position</span><span class="v">${pos}</span></div>
        <div class="kv"><span class="k">Fix</span><span class="v">${status.fix}</span></div>
        <div class="kv"><span class="k">Signal</span><span class="v">${status.satellites_used ?? '-'} / ${status.satellites_visible ?? '-'} sats</span></div>
        <div class="kv"><span class="k">Last update</span><span class="v">${timeSinceLabel(lastGpsUpdateAt)}</span></div>
        ${waitingNote}
      `;
    }

    // ── UI theme toggle (page chrome only; the map has its own separate
    // toggle, see initDashboardMap below, so the two can differ) ───────
    const UI_THEME_KEY = 'ui-theme';
    const THEME_CYCLE = [null, 'light', 'dark']; // null = follow system
    const THEME_LABELS = { null: 'Theme: System', light: 'Theme: Light', dark: 'Theme: Dark' };

    function applyUiTheme(theme) {
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      document.getElementById('theme-toggle').textContent = THEME_LABELS[theme];
    }

    let uiTheme = localStorage.getItem(UI_THEME_KEY);
    if (!THEME_CYCLE.includes(uiTheme)) uiTheme = null;
    applyUiTheme(uiTheme);

    document.getElementById('theme-toggle').addEventListener('click', () => {
      uiTheme = THEME_CYCLE[(THEME_CYCLE.indexOf(uiTheme) + 1) % THEME_CYCLE.length];
      if (uiTheme) localStorage.setItem(UI_THEME_KEY, uiTheme);
      else localStorage.removeItem(UI_THEME_KEY);
      applyUiTheme(uiTheme);
    });

    // ── Auth (login/config/logout buttons, and gating the Direwolf
    // control below) ─────────────────────────────────────────────────
    // Populated once at boot from /api/auth/status: see the boot IIFE.
    // mode 'full' never actually shows this page logged-out at all
    // (server.py's root() redirects to /login first), so the only
    // logged-out case this page itself ever has to render is 'readonly'.
    let authState = { mode: 'none', logged_in: false };

    function renderAuthControls() {
      const canConfig = authState.mode === 'none' || authState.logged_in;
      const showLogin = authState.mode !== 'none' && !authState.logged_in;
      const showLogout = authState.mode !== 'none' && authState.logged_in;
      document.getElementById('btn-config').classList.toggle('hidden', !canConfig);
      document.getElementById('btn-login').classList.toggle('hidden', !showLogin);
      document.getElementById('btn-logout').classList.toggle('hidden', !showLogout);
    }

    document.getElementById('btn-config').addEventListener('click', () => { location.href = '/config'; });
    document.getElementById('btn-login').addEventListener('click', () => { location.href = '/login'; });
    document.getElementById('btn-logout').addEventListener('click', async () => {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } finally {
        location.reload();
      }
    });

    // ── Confirm modal (used both as a bare "are you sure" and, with
    // custom labels, as the Direwolf badge's login-required prompt below) ──
    function confirmModal(text, { okLabel = 'Confirm', cancelLabel = 'Cancel' } = {}) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('confirm-modal');
        const okBtn = document.getElementById('confirm-modal-ok');
        const cancelBtn = document.getElementById('confirm-modal-cancel');
        document.getElementById('confirm-modal-text').textContent = text;
        okBtn.textContent = okLabel;
        cancelBtn.textContent = cancelLabel;
        overlay.classList.remove('hidden');
        function cleanup(result) {
          overlay.classList.add('hidden');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          resolve(result);
        }
        function onOk() { cleanup(true); }
        function onCancel() { cleanup(false); }
        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
      });
    }

    // ── Direwolf status/control badge, living in the station card's own
    // header row to the right of the callsign (no separate "System
    // status" card anymore). services/system.py reports the real
    // direwolf.service state where one is installed, falling back to an
    // in-memory simulated state otherwise; this just displays and acts
    // on whatever that says. ──────────────────────────────────────────
    const DIREWOLF_STATE_LABELS = {
      running: 'Running',
      starting: 'Starting',
      waiting_gps: 'Waiting for GPS fix',
      standby: 'Standby',
      stopping: 'Stopping',
      error: 'Error',
    };

    async function toggleDirewolf(status) {
      const wantRunning = !status.running;
      // Not logged in under readonly/full gets a "log in first" modal
      // instead of reaching this at all (see renderSystemStatusBody
      // below), which is itself an "are you sure"; so only mode 'none'
      // (no login gate at all) also needs a confirm modal here, as its
      // own safety net against a stray click.
      if (authState.mode === 'none') {
        const ok = await confirmModal(`${wantRunning ? 'Start' : 'Stop'} Direwolf?`);
        if (!ok) return;
      }
      const msg = document.getElementById('direwolf-msg');
      msg.textContent = '';
      msg.className = 'msg';
      try {
        const res = await fetch(`/api/system/direwolf/${wantRunning ? 'start' : 'stop'}`, { method: 'POST' });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          msg.textContent = body.detail || 'Failed to change Direwolf state.';
          msg.className = 'msg error';
        }
      } catch (e) {
        msg.textContent = 'Could not reach the server.';
        msg.className = 'msg error';
      }
      renderSystemStatusBody();
    }

    async function renderSystemStatusBody() {
      const badgeSlot = document.getElementById('direwolf-badge-slot');

      let status;
      try {
        status = await (await fetch('/api/system/direwolf/status')).json();
      } catch (e) {
        return; // one missing badge isn't worth a dedicated error state
      }
      lastDirewolfState = status.state;
      const canControl = authState.mode === 'none' || authState.logged_in;
      // "simulated" means there's no real direwolf.service to ask/control
      // yet (see services/system.py): an in-memory stand-in so this
      // control's UX (confirm modal, login gating, badge state) can
      // actually be clicked through and tested. Labelled, not hidden, so
      // it's never mistaken for real control once a real service exists.
      const stateLabel = DIREWOLF_STATE_LABELS[status.state] || status.state || 'Standby';
      const label = 'System: ' + stateLabel + (status.simulated ? ' (sim)' : '');
      const title = status.state === 'error' && status.reason
        ? status.reason
        : status.simulated ? 'No direwolf.service installed yet. This toggles an in-memory simulated state for UI testing only.' : '';
      // Replacing badgeSlot's contents in one assignment below (rather than
      // clearing it first, then filling it in) so the button never
      // momentarily disappears from the DOM: this function reruns every
      // DIREWOLF_POLL_MS, and a clear-then-refill was flickering the
      // button out and back in on every poll.
      const isPending = status.state === 'starting' || status.state === 'stopping' || status.state === 'waiting_gps';
      const badgeClass = `badge${status.state === 'running' ? ' on' : ''}${status.state === 'error' ? ' error' : ''}${isPending ? ' pending' : ''}`;
      // Always clickable, even when not logged in: readonly/full mode
      // without a session gets an explicit "log in first" modal instead
      // of a disabled, unexplained button.
      badgeSlot.innerHTML = `<button type="button" class="${badgeClass}" id="direwolf-toggle" title="${title}">${label}</button>`;
      document.getElementById('direwolf-toggle').addEventListener('click', async () => {
        if (!canControl) {
          const ok = await confirmModal('Log in to change state', { okLabel: 'Log in', cancelLabel: 'Cancel' });
          if (ok) location.href = '/login';
          return;
        }
        toggleDirewolf(status);
      });
    }

    // ── Beacon stats card (sample data: no packet source exists yet to
    // report real transmit times from) ──────────────────────────────────
    function renderBeaconStatsBody(cfg) {
      const card = document.getElementById('beacon-stats-card');
      const aprs = cfg.aprs || {};
      if (!aprs.callsign) {
        card.classList.add('hidden');
        return;
      }
      card.classList.remove('hidden');
      document.getElementById('beacon-stats-body').innerHTML = `
        <div class="kv"><span class="k">Last beacon</span><span class="v">2m ago</span></div>
        <div class="kv"><span class="k">Next beacon</span><span class="v">in 8m</span></div>
      `;
    }

    // ── Heard stations card (sample data: no packet source exists yet to
    // list real heard stations from) ─────────────────────────────────────
    // dLat/dLon are small offsets from the home point, not absolute
    // coordinates; the home point itself isn't known until config/GPS
    // has loaded (see initDashboardMap), so sample markers are placed
    // relative to wherever that ends up being, not hardcoded to one spot.
    const SAMPLE_HEARD_STATIONS = [
      { callsign: 'ZL1ABC-9', symbol: { table: '/', symbol: '>' }, count: 14, seconds_ago: 180, dLat: 0.03, dLon: 0.02 },
      { callsign: 'ZL2XYZ', symbol: { table: '/', symbol: '#' }, count: 47, seconds_ago: 720, dLat: -0.015, dLon: 0.04 },
      { callsign: 'ZL3DEF-7', symbol: { table: '/', symbol: '[' }, count: 2, seconds_ago: 3600, dLat: -0.025, dLon: -0.03 },
    ];

    function renderHeardStations() {
      const list = document.getElementById('heard-list');
      if (SAMPLE_HEARD_STATIONS.length === 0) {
        list.innerHTML = `<div class="note">No stations heard yet.</div>`;
        return;
      }
      list.innerHTML = SAMPLE_HEARD_STATIONS.map(s => `
        <div class="heard-row">
          <span class="heard-icon">${symbolGlyphHTML(s.symbol, 20)}</span>
          <span class="heard-call">${s.callsign}</span>
          <span class="heard-count">×${s.count}</span>
          <span class="heard-time">${timeSinceLabel(new Date(Date.now() - s.seconds_ago * 1000))}</span>
        </div>
      `).join('');
    }

    // ── Home-location map ─────────────────────────────────────────────
    async function initDashboardMap(cfg, worldAvailable, regionAvailable, online) {
      const mapUnavailable = document.getElementById('map-unavailable');
      if (!online && !worldAvailable && !regionAvailable) {
        mapUnavailable.classList.remove('hidden');
        return;
      }

      // Home point: manual position wins outright (it's exact and static);
      // otherwise a live GPS fix; otherwise the center of the region
      // picked during setup (still roughly "home", since that's what it
      // was centered on); otherwise nothing to show a marker at.
      let homeLat = null, homeLon = null;
      const gpsCfg = cfg.gps || {};
      const mapCfg = cfg.map || {};
      if (gpsCfg.position_source === 'manual' && gpsCfg.latitude && gpsCfg.longitude) {
        homeLat = parseFloat(gpsCfg.latitude);
        homeLon = parseFloat(gpsCfg.longitude);
      } else {
        try {
          const res = await fetch('/api/gps/position');
          const data = await res.json();
          if (data.available) {
            homeLat = data.latitude;
            homeLon = data.longitude;
          }
        } catch (e) {
          // Falls through to the region-center fallback below.
        }
      }
      if (homeLat === null && mapCfg.north !== undefined && mapCfg.south !== undefined) {
        homeLat = (parseFloat(mapCfg.north) + parseFloat(mapCfg.south)) / 2;
        homeLon = (parseFloat(mapCfg.east) + parseFloat(mapCfg.west)) / 2;
      }
      const center = [homeLon ?? 0, homeLat ?? 0];

      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);

      // When the Pi has internet, stream the live planet archive via the
      // same-origin proxy (see web/server.py's /map-data/live.pmtiles):
      // full detail everywhere, no gaps outside the cached region, at the
      // cost of every tile being a network round trip instead of a local
      // disk read. Local and remote PMTiles archives address tiles by byte
      // offset into their own separately-computed directory, so there's no
      // way to mix "this tile from cache, that one from the proxy" within
      // a single source; it's whichever one for the whole session. Falls
      // back to local (region data preferred over the coarser world
      // precache) when there's no internet.
      const pmtilesFile = online ? 'live.pmtiles' : (regionAvailable ? 'region.pmtiles' : 'world.pmtiles');
      const pmtilesUrl = `pmtiles://${location.origin}/map-data/${pmtilesFile}`;

      // The map's own theme toggle (top-left map control below), entirely
      // separate from the page's UI theme toggle in the sidebar: a station
      // photo/terrain preference for the map has nothing to do with
      // whether the sidebar chrome is light or dark, so they're tracked
      // independently (own localStorage key, own cycle state).
      const MAP_THEME_KEY = 'map-theme';
      const MAP_THEME_LABELS = { null: 'Map: System', light: 'Map: Light', dark: 'Map: Dark' };
      let mapTheme = localStorage.getItem(MAP_THEME_KEY);
      if (!THEME_CYCLE.includes(mapTheme)) mapTheme = null;

      function resolveMapDark(theme) {
        if (theme === 'light') return false;
        if (theme === 'dark') return true;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      async function buildMapStyle(dark) {
        const styleUrl = `/static/maplibre/style-${dark ? 'dark' : 'light'}.json`;
        const s = await (await fetch(styleUrl)).json();
        s.sources.protomaps.url = pmtilesUrl;
        return s;
      }

      const map = new maplibregl.Map({
        container: 'dashboard-map',
        style: await buildMapStyle(resolveMapDark(mapTheme)),
        center,
        zoom: homeLat !== null ? 12 : 1,
      });
      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      // A small custom control (MapLibre's IControl interface) rather
      // than a page-level button: keeps it visually and physically
      // scoped to the map itself, and top-left keeps it clear of the
      // NavigationControl's zoom/compass buttons at top-right. Doesn't
      // react to a live OS theme change while set to "System" (would
      // need its own matchMedia listener re-triggering setStyle); a
      // minor gap, not worth the extra listener for how rarely that'd
      // actually happen while the dashboard is open.
      class MapThemeControl {
        onAdd(mapInstance) {
          this._container = document.createElement('div');
          this._container.className = 'maplibregl-ctrl maplibregl-ctrl-group';
          const btn = document.createElement('button');
          btn.type = 'button';
          // Explicit black-on-white, not inherited from the page's own
          // --panel/--text theme vars: this button lives inside MapLibre's
          // own control chrome (built-in zoom/attribution controls are
          // always a fixed white/black, unaffected by page dark mode), and
          // the page's :root sets color-scheme: dark light, which makes an
          // unstyled <button>'s native text color follow that in dark
          // mode; MapLibre's CSS forces the background white regardless,
          // so the two together were rendering invisible white-on-white
          // text whenever the sidebar's UI theme (independent of this map
          // control) was dark. Fixed values keep this control visually
          // consistent with the map's other native controls instead.
          btn.style.cssText = 'width:auto;padding:0 10px;font-size:12px;font-family:inherit;white-space:nowrap;color:#333;background:#fff;';
          btn.textContent = MAP_THEME_LABELS[mapTheme];
          btn.addEventListener('click', async () => {
            mapTheme = THEME_CYCLE[(THEME_CYCLE.indexOf(mapTheme) + 1) % THEME_CYCLE.length];
            if (mapTheme) localStorage.setItem(MAP_THEME_KEY, mapTheme);
            else localStorage.removeItem(MAP_THEME_KEY);
            btn.textContent = MAP_THEME_LABELS[mapTheme];
            mapInstance.setStyle(await buildMapStyle(resolveMapDark(mapTheme)));
          });
          this._container.appendChild(btn);
          return this._container;
        }
        onRemove() {
          this._container.parentNode.removeChild(this._container);
        }
      }
      map.addControl(new MapThemeControl(), 'top-left');

      await new Promise(resolve => map.on('load', resolve));

      if (homeLat !== null) {
        // A ring outline around the icon, not just the icon alone, so the
        // home station reads as distinct from the heard-station markers
        // below, same icon size as those (28px) with just a thin
        // transparent-backed outline added, not a bigger solid badge.
        const el = document.createElement('div');
        el.style.cssText = 'width:34px;height:34px;border-radius:50%;border:3px solid var(--accent);box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:transparent;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.5));';
        const aprs = cfg.aprs || {};
        const sym = (aprs.symbol && aprs.symbol.table && aprs.symbol.symbol) ? aprs.symbol : { table: '/', symbol: '#' };
        el.innerHTML = symbolGlyphHTML(sym, 28);
        new maplibregl.Marker({ element: el }).setLngLat(center).addTo(map);

        // Same sample data as the Heard stations sidebar card, plotted
        // nearby (see SAMPLE_HEARD_STATIONS' dLat/dLon): confirms the
        // whole icon-rendering pipeline works for more than just the one
        // home marker, ahead of a real packet source existing to place
        // these from real heard-station positions instead.
        for (const s of SAMPLE_HEARD_STATIONS) {
          const sEl = document.createElement('div');
          sEl.style.cssText = 'width:28px;height:28px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));';
          sEl.innerHTML = symbolGlyphHTML(s.symbol, 28);
          new maplibregl.Marker({ element: sEl })
            .setLngLat([homeLon + s.dLon, homeLat + s.dLat])
            .addTo(map);
        }
      }
    }

    // ── Boot ──────────────────────────────────────────────────────────
    (async () => {
      try {
        authState = await (await fetch('/api/auth/status')).json();
      } catch (e) {
        authState = { mode: 'none', logged_in: false };
      }
      renderAuthControls();

      let cfg = {};
      try {
        const res = await fetch('/api/config');
        if (res.ok) cfg = await res.json();
      } catch (e) {
        // Falls through: every card below handles a missing/partial cfg.
        // Under mode 'full' while logged out this 401s (see server.py's
        // get_config); unreachable in practice since root() would have
        // redirected to /login before this page's JS ever ran, but this
        // still degrades to an empty cfg rather than throwing either way.
      }

      renderStationCard(cfg);
      renderSystemStatusBody();
      setInterval(renderSystemStatusBody, DIREWOLF_POLL_MS);
      renderBeaconStatsBody(cfg);
      renderHeardStations();

      const gpsCfg = cfg.gps || {};
      if (gpsCfg.position_source === 'manual') {
        renderGpsBody(gpsCfg, null);
      } else {
        async function pollGps() {
          try {
            const res = await fetch('/api/gps/status');
            renderGpsBody(gpsCfg, await res.json());
          } catch (e) {
            renderGpsBody(gpsCfg, { available: false, reason: 'Could not reach the server.' });
          }
        }
        await pollGps();
        gpsPollTimer = setInterval(pollGps, GPS_POLL_MS);
      }

      let worldAvailable = false, regionAvailable = false, online = false;
      try {
        worldAvailable = (await (await fetch('/api/map/world-status')).json()).available;
      } catch (e) {}
      try {
        regionAvailable = (await (await fetch('/api/map/region-status')).json()).available;
      } catch (e) {}
      try {
        online = (await (await fetch('/api/network/internet')).json()).online;
      } catch (e) {}

      initDashboardMap(cfg, worldAvailable, regionAvailable, online);
    })();
  </script>
</body>
</html>
