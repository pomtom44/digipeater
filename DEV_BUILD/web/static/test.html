<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>APRS Digipeater</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; gap: 20px; }
    .box { text-align: center; }
    h1 { margin-bottom: 4px; }
    p { color: #9a9; }
    .panel { border: 1px solid #333; border-radius: 8px; padding: 16px 24px; min-width: 280px; text-align: center; }
    .panel h2 { font-size: 15px; margin: 0 0 8px; color: #ccc; }
    .panel p { margin: 0 0 12px; font-size: 13px; }
    button { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px 14px; margin: 0 4px; cursor: pointer; font-size: 13px; }
    button:hover { background: #333; }
    #display-status { color: #9a9; font-size: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>APRS Digipeater</h1>
    <p id="status">checking server…</p>
  </div>

  <div class="panel">
    <h2>E-Ink Display</h2>
    <p id="display-status">checking display…</p>
    <button id="btn-display-test">Test Pattern</button>
    <button id="btn-display-clear">Clear</button>
    <button id="btn-display-sleep">Sleep</button>
  </div>

  <script>
    fetch('/api/status')
      .then(r => r.json())
      .then(d => document.getElementById('status').textContent = d.ok ? 'Web server framework is running.' : 'Server responded but reported an error.')
      .catch(() => document.getElementById('status').textContent = 'Could not reach the server.');

    function refreshDisplayStatus() {
      fetch('/api/display/status')
        .then(r => r.json())
        .then(d => document.getElementById('display-status').textContent = `${d.driver} — ${d.width}x${d.height}`)
        .catch(() => document.getElementById('display-status').textContent = 'Could not reach display status.');
    }

    async function callDisplay(path) {
      const el = document.getElementById('display-status');
      const prev = el.textContent;
      el.textContent = 'working…';
      try {
        const r = await fetch(path, { method: 'POST' });
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(body.detail || r.statusText);
        }
        refreshDisplayStatus();
      } catch (e) {
        el.textContent = `Error: ${e.message}`;
      }
    }

    document.getElementById('btn-display-test').addEventListener('click', () => callDisplay('/api/display/test'));
    document.getElementById('btn-display-clear').addEventListener('click', () => callDisplay('/api/display/clear'));
    document.getElementById('btn-display-sleep').addEventListener('click', () => callDisplay('/api/display/sleep'));

    refreshDisplayStatus();
  </script>
</body>
</html>
