    const GPIO_DEFAULT_RELAY_PIN = 27;
    const GPIO_DEFAULT_EINK_RST = 17;
    const GPIO_DEFAULT_EINK_DC = 25;
    const GPIO_DEFAULT_EINK_CS = 8;
    const GPIO_DEFAULT_EINK_BUSY = 24;

    function renderGpioTab() {
      const gp = state.gpio || {};
      const pttPin = state.radio?.ptt_gpio_pin ?? RADIO_DEFAULT_PTT_GPIO_PIN;
      document.getElementById('gpio-tab-content').innerHTML = `
        <section>
          <p class="hint">Defaults are already configured for best compatibility and performance. Only change these if you have a specific wiring reason to.</p>

          <div class="field">
            <label for="gpio-ptt-gpio-pin">PTT pin (BCM) ${helpIcon("Used only when the Radio tab's PTT method is set to GPIO pin. Applies live: Direwolf's config is rewritten and it's restarted if currently running, no reboot needed.")}</label>
            <input type="number" id="gpio-ptt-gpio-pin" min="0" max="27" value="${pttPin}">
          </div>

          <div class="field">
            <label for="gpio-relay-pin">Radio power relay pin (BCM) ${helpIcon("Reboot required: this pin is claimed once, at process start, so a change here only takes effect on the next boot.")}</label>
            <input type="number" id="gpio-relay-pin" min="0" max="27" value="${gp.relay_pin ?? GPIO_DEFAULT_RELAY_PIN}">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="gpio-eink-rst">E-Ink RST pin (BCM)</label>
              <input type="number" id="gpio-eink-rst" min="0" max="27" value="${gp.eink_rst ?? GPIO_DEFAULT_EINK_RST}">
            </div>
            <div class="field">
              <label for="gpio-eink-dc">E-Ink DC pin (BCM)</label>
              <input type="number" id="gpio-eink-dc" min="0" max="27" value="${gp.eink_dc ?? GPIO_DEFAULT_EINK_DC}">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="gpio-eink-cs">E-Ink CS pin (BCM)</label>
              <input type="number" id="gpio-eink-cs" min="0" max="27" value="${gp.eink_cs ?? GPIO_DEFAULT_EINK_CS}">
            </div>
            <div class="field">
              <label for="gpio-eink-busy">E-Ink BUSY pin (BCM)</label>
              <input type="number" id="gpio-eink-busy" min="0" max="27" value="${gp.eink_busy ?? GPIO_DEFAULT_EINK_BUSY}">
            </div>
          </div>
          <p class="hint">E-Ink pins also need a reboot: they're claimed once, when the display driver initializes.</p>

          <p class="warn-banner hidden" id="gpio-conflict-warning">Two of these pins are set to the same value. That will conflict: give each one a different pin.</p>
        </section>
      `;

      const pinIds = ['gpio-ptt-gpio-pin', 'gpio-relay-pin', 'gpio-eink-rst', 'gpio-eink-dc', 'gpio-eink-busy', 'gpio-eink-cs'];
      function updateConflictWarning() {
        const values = pinIds.map(id => document.getElementById(id).value).filter(v => v !== '');
        const hasDupe = new Set(values).size !== values.length;
        document.getElementById('gpio-conflict-warning').classList.toggle('hidden', !hasDupe);
      }
      pinIds.forEach(id => document.getElementById(id).addEventListener('input', updateConflictWarning));
      updateConflictWarning();
    }

    // radio.ptt_gpio_pin is deliberately NOT collected here: it's read
    // directly off this tab's own input by collectRadioTab() instead,
    // since the backend's gpio config-save key means only these five
    // pins (see /api/config/save in web/server.py).
    function collectGpioTab() {
      const gpio = {
        relay_pin: parseInt(document.getElementById('gpio-relay-pin').value, 10) || GPIO_DEFAULT_RELAY_PIN,
        eink_rst: parseInt(document.getElementById('gpio-eink-rst').value, 10) || GPIO_DEFAULT_EINK_RST,
        eink_dc: parseInt(document.getElementById('gpio-eink-dc').value, 10) || GPIO_DEFAULT_EINK_DC,
        eink_cs: parseInt(document.getElementById('gpio-eink-cs').value, 10) || GPIO_DEFAULT_EINK_CS,
        eink_busy: parseInt(document.getElementById('gpio-eink-busy').value, 10) || GPIO_DEFAULT_EINK_BUSY,
      };
      state.gpio = gpio;
      return gpio;
    }

    // ── Save-all (the page's single global save action; Map and Network
    // are excluded, see their own tabs above) ───────────────────────────
    const APPLIED_LABELS = { gps: 'GPS', radio: 'Radio', aprs: 'APRS', startup: 'Startup (restart policy)', display_pages: 'E-Ink page rotation' };
    const REBOOT_LABELS = { gpio: 'GPIO pins (relay and e-ink)', display: 'E-Ink display driver/model' };

    function hideSaveBanner() {
      document.getElementById('save-banner-wrap').classList.add('hidden');
    }

    function showSaveBanner(kind, html) {
      const wrap = document.getElementById('save-banner-wrap');
      const banner = document.getElementById('save-banner');
      banner.className = `banner ${kind}`;
      banner.innerHTML = html;
      wrap.classList.remove('hidden');
    }

    function renderSaveResult(data) {
      const applied = (data.applied || []).map(k => APPLIED_LABELS[k] || k);
      const reboot = (data.reboot_required || []).map(k => REBOOT_LABELS[k] || k);
      let html = '<strong>Saved.</strong>';
      if (applied.length) html += `Applied immediately: ${applied.join(', ')}. `;
      if (reboot.length) html += `Needs a reboot to take effect: ${reboot.join(', ')}. `;
      if (!applied.length && !reboot.length) html += 'Nothing needed live-applying.';
      if (reboot.length) {
        html += '<div><button type="button" id="btn-reboot-now">Reboot now</button></div>';
      }
      showSaveBanner('success', html);
      if (reboot.length) {
        document.getElementById('btn-reboot-now').addEventListener('click', rebootNow);
      }
    }

    async function rebootNow() {
      // A region download doesn't survive a reboot and can't be resumed
      // (see services/tiles.py's RegionDownloader): the wizard's own
      // Finish step already blocks on this (first_run.html), but this is
      // a separate, later reboot path (post-setup, from a GPIO/display
      // save), so it needs its own check. Best-effort: a failed status
      // check is treated as "can't tell, don't block on it" rather than
      // trapping the user if the endpoint itself is having trouble.
      try {
        const res = await fetch('/api/map/cache/status');
        const data = await res.json();
        if (data.active) {
          showSaveBanner('error', 'A map region download is still running (Map tab). Rebooting now would stop it with no way to resume, wait for it to finish or cancel it first.');
          return;
        }
      } catch (e) {
        // Unknown either way; fall through rather than blocking on it.
      }

      const proceed = await confirmModal(
        'Reboot the device now? This will briefly take the station and this page offline.',
        'Yes, reboot now', 'Not yet'
      );
      if (!proceed) return;
      const btn = document.getElementById('btn-reboot-now');
      if (btn) { btn.disabled = true; btn.textContent = 'Rebooting...'; }
      try {
        const res = await fetch('/api/system/reboot', { method: 'POST' });
        if (!res.ok) throw new Error('reboot endpoint unavailable');
        if (btn) btn.textContent = 'Rebooting, this page will stop responding shortly...';
      } catch (e) {
        // No standalone reboot endpoint exists outside first-boot setup's
        // own /api/setup/complete (see web/server.py): degrades to asking
        // for a manual power-cycle rather than pretending this worked.
        showSaveBanner('error', 'Could not trigger a reboot automatically. Please power-cycle the device by hand for the changes above to take effect.');
      }
    }

    async function saveAll() {
      const msg = document.getElementById('save-all-msg');
      msg.textContent = '';
      msg.className = 'msg';
      hideSaveBanner();

      collectRadioTab();
      collectAprsTab();
      const gps = collectGpsTab();
      if (!gps) {
        switchTab('gps');
        msg.textContent = 'Fix the GPS tab before saving.';
        msg.className = 'msg error';
        return;
      }
      collectStartupTab();
      collectEinkTab();
      const user = collectUserTab();
      if (!user) {
        switchTab('user');
        msg.textContent = 'Fix the User tab before saving.';
        msg.className = 'msg error';
        return;
      }
      collectGpioTab();

      const payload = {
        radio: state.radio,
        aprs: state.aprs,
        gps: state.gps,
        startup: state.startup,
        gpio: state.gpio,
        display: state.display,
        user: state.user,
      };

      const btn = document.getElementById('btn-save-all');
      const prevText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const res = await fetch('/api/config/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (res.status === 401) {
          showSaveBanner('error', 'Your session has expired. <a href="/login">Log in again</a> to save changes.');
          return;
        }
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          showSaveBanner('error', `Save failed: ${body.detail || res.statusText}`);
          return;
        }
        const data = await res.json();
        renderSaveResult(data);
      } catch (e) {
        showSaveBanner('error', 'Could not reach the server.');
      } finally {
        btn.disabled = false;
        btn.textContent = prevText;
      }
    }

    // ── Boot: hydrate state from GET /api/config + GET /api/display/config,
    // then render every tab except Map (deferred to first click; see
    // switchTab). ────────────────────────────────────────────────────────
    (async () => {
      document.getElementById('btn-save-all').textContent = 'Save all changes';

      try {
        authState = await (await fetch('/api/auth/status')).json();
      } catch (e) {
        authState = { mode: 'none', logged_in: false };
      }

      let cfg = {};
      try {
        const res = await fetch('/api/config');
        if (res.status === 401) {
          location.href = '/login';
          return;
        }
        if (res.ok) cfg = await res.json();
      } catch (e) {
        // Degrades to an empty cfg: every tab below handles missing
        // sections by falling back to defaults, same as the wizard does
        // for a fresh, never-configured field.
      }

      state.radio = cfg.radio || {};
      state.aprs = cfg.aprs || {};
      state.gps = cfg.gps || {};
      state.map = cfg.map || {};
      state.startup = cfg.startup || {};
      state.gpio = cfg.gpio || {};
      // GET /api/config's security section only ever carries {mode}: see
      // get_config() in web/server.py, which strips hash/salt before
      // this response is even built. "user" isn't a real config.yaml
      // section, it's this page's (and the wizard's) name for that data.
      state.user = { mode: (cfg.security && cfg.security.mode) || 'none' };
      state.display = { pages: (cfg.display && cfg.display.pages) || [] };

      try {
        const res = await fetch('/api/display/config');
        if (res.ok) {
          const d = await res.json();
          state.display.driver = d.driver || 'none';
          state.display.model = d.model || '';
        } else {
          state.display.driver = 'none';
          state.display.model = '';
        }
      } catch (e) {
        state.display.driver = 'none';
        state.display.model = '';
      }

      renderTabbar();
      TABS.forEach(t => document.getElementById(`panel-${t.id}`).classList.toggle('hidden', t.id !== activeTab));

      renderNetworkTab();
      renderAprsTab();
      renderRadioTab();
      renderGpsTab();
      renderEinkTab();
      renderUserTab();
      renderStartupTab();
      renderGpioTab();

      document.getElementById('btn-save-all').addEventListener('click', saveAll);
      document.getElementById('btn-back-dashboard').addEventListener('click', () => { location.href = '/'; });
    })();
  </script>
</body>
</html>
