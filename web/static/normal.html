<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APRS Digipeater</title>
  <!-- Sets the theme before first paint to avoid a flash of the wrong theme. -->
  <script>
    (function() {
      var t = localStorage.getItem('ui-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <!-- Vendored locally (no CDN); see web/static/maplibre/. -->
  <link rel="stylesheet" href="/static/maplibre/maplibre-gl.css">
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1416;
      --panel: #161d20;
      --panel-2: #1c2427;
      --border: #263238;
      --text: #e8edee;
      --muted: #8a9ba0;
      --accent: #4fb3a9;
      --success: #5fbf8e;
      --error: #e08585;
      --warn: #e0b155;
    }
    /* System preference, only when there's no explicit override below. */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f6f6;
        --panel: #ffffff;
        --panel-2: #f0f3f3;
        --border: #dde3e3;
        --text: #1a2226;
        --muted: #62726f;
        --accent: #2e8b7f;
        --success: #2e8b57;
        --error: #b03a3a;
        --warn: #b0791f;
      }
    }
    /* Explicit override via the theme toggle, wins over system preference. */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f6f6;
      --panel: #ffffff;
      --panel-2: #f0f3f3;
      --border: #dde3e3;
      --text: #1a2226;
      --muted: #62726f;
      --accent: #2e8b7f;
      --success: #2e8b57;
      --error: #b03a3a;
      --warn: #b0791f;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1416;
      --panel: #161d20;
      --panel-2: #1c2427;
      --border: #263238;
      --text: #e8edee;
      --muted: #8a9ba0;
      --accent: #4fb3a9;
      --success: #5fbf8e;
      --error: #e08585;
      --warn: #e0b155;
    }

    * { box-sizing: border-box; }

    /* !important ensures .hidden always wins regardless of selector specificity. */
    .hidden { display: none !important; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app {
      display: flex;
      height: 100%;
      width: 100%;
    }

    #sidebar {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow: hidden;
      padding: 16px;
    }

    /* Flexes to fill whatever space the other cards leave, so a long heard-stations list scrolls
       inside itself instead of pushing the auth-row buttons below the viewport. */
    #heard-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #heard-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    #map-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #dashboard-map {
      position: absolute;
      inset: 0;
    }

    #map-unavailable {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: var(--muted);
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card h2 {
      font-size: 11px;
      margin: 0 0 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .heard-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .heard-row:last-child { border-bottom: none; }
    .heard-row { cursor: pointer; }
    .heard-row.selected { background: color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 4px; }

    /* maplibre-gl.css hardcodes the popup background to white with no color of its own, so text
       would otherwise inherit --text and go invisible (white-on-white) in dark theme. */
    .maplibregl-popup-content { color: #1a2226; }

    .history-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .history-slider-row label { flex-shrink: 0; }
    .history-slider-row input[type="range"] { flex: 1; }

    #gps-title { display: flex; align-items: baseline; }
    .gps-title-pos {
      text-transform: none;
      letter-spacing: normal;
      font-weight: 400;
      color: var(--text);
      margin-left: auto;
      padding-left: 6px;
    }
    .heard-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 4px;
      background: var(--panel);
      overflow: hidden;
    }
    .heard-call { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .heard-count { color: var(--muted); font-size: 11px; }
    .heard-time { color: var(--muted); font-size: 11px; width: 56px; text-align: right; flex-shrink: 0; }

    .station-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Callsign wrapper shrinks first so a long callsign never pushes the badge off-edge. */
    .station-header > div:not(.station-symbol) {
      min-width: 0;
      flex-shrink: 1;
    }

    #direwolf-badge-slot {
      flex-shrink: 0;
    }

    .station-symbol {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .station-callsign {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .station-comment {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.on {
      color: var(--accent);
      border-color: var(--accent);
    }
    .badge.error {
      color: var(--error);
      border-color: var(--error);
    }
    .badge.pending {
      color: var(--warn);
      border-color: var(--warn);
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      padding: 3px 0;
    }
    .kv .k { color: var(--muted); }
    .kv .v { text-align: right; }

    .note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .msg {
      font-size: 12px;
      margin: 6px 0 0;
      min-height: 0;
    }
    .msg:empty { margin: 0; }
    .msg.error { color: var(--error); }

    .btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      flex: 1;
    }
    .btn:hover { border-color: var(--accent); }

    .auth-row {
      display: flex;
      gap: 8px;
      /* Sits at the bottom of the flex-column sidebar since #heard-card above absorbs the rest of
         the available space. */
      padding-top: 16px;
    }

    button.badge {
      font-family: inherit;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    /* Scoped to :not(.hidden) to avoid a specificity tie with .hidden. */
    .modal-overlay:not(.hidden) { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 320px;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .log-modal-box { max-width: 560px; }
    .log-modal-text {
      max-height: 60vh;
      overflow: auto;
      margin: 8px 0 0;
      padding: 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #sidebar-toggle {
      display: none;
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 720px) {
      #sidebar-toggle { display: block; }
      #sidebar {
        position: absolute;
        z-index: 9;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.3);
      }
      #sidebar.open { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="card" id="station-card">
        <div class="station-header">
          <div class="station-symbol" id="station-symbol"></div>
          <div>
            <div class="station-callsign" id="station-callsign">-</div>
          </div>
          <div id="direwolf-badge-slot" style="margin-left:auto"></div>
        </div>
        <div class="station-comment" id="station-comment"></div>
        <div class="badge-row" id="station-badges"></div>
      </div>

      <div class="card">
        <h2 id="gps-title">GPS</h2>
        <div id="gps-body"><div class="note">Checking…</div></div>
      </div>

      <div class="card" id="beacon-stats-card">
        <h2>Beacon stats</h2>
        <div id="beacon-stats-body"></div>
      </div>

      <div class="card" id="heard-card">
        <h2>Heard stations</h2>
        <div class="history-slider-row">
          <label for="history-slider">History: <span id="history-slider-label">24h</span></label>
          <input type="range" id="history-slider" min="1" max="24" step="1" value="24">
        </div>
        <div id="heard-list"></div>
      </div>

      <div class="auth-row">
        <button type="button" id="theme-toggle" class="btn" title="UI theme (independent of the map's own theme toggle, top-left on the map itself)"></button>
        <button type="button" id="btn-config" class="btn hidden">Config</button>
        <button type="button" id="btn-history" class="btn hidden">History</button>
        <button type="button" id="btn-stats" class="btn hidden">Stats</button>
        <button type="button" id="btn-login" class="btn hidden">Log in</button>
        <button type="button" id="btn-logout" class="btn hidden">Log out</button>
      </div>
    </aside>

    <button type="button" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>

    <main id="map-wrap">
      <div id="dashboard-map"></div>
      <div id="map-unavailable" class="hidden">
        <div>
          <p>No map data cached, and no internet available to stream one.</p>
          <p class="note">Run the installer, check the Map caching step during setup, or connect the Pi to the internet.</p>
        </div>
      </div>
    </main>

    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="card modal-box">
        <p id="confirm-modal-text"></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="confirm-modal-cancel">Cancel</button>
          <button type="button" class="btn" id="confirm-modal-ok">Confirm</button>
        </div>
      </div>
    </div>

    <div id="log-modal" class="modal-overlay hidden">
      <div class="card modal-box log-modal-box">
        <h2>Direwolf logs</h2>
        <pre id="log-modal-text" class="log-modal-text"></pre>
        <div class="modal-actions">
          <button type="button" class="btn" id="log-modal-retry">Try again</button>
          <button type="button" class="btn" id="log-modal-close">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/maplibre/maplibre-gl.js"></script>
  <script src="/static/maplibre/pmtiles.js"></script>
  <script>
    // ── APRS symbol glyph rendering, from the shared sprite sheet (web/static/aprs-symbols/) ──
    const SPRITE_CELL_W = 64;
    const SPRITE_CELL_H = 64;
    const SPRITE_SHEET_W = 1024;
    const SPRITE_SHEET_H = 384;
    const SPRITE_BASE = '/static/aprs-symbols/';

    function symbolGlyphHTML(sym, displayW) {
      const sheet = sym.table === '\\' ? 'sheet1.png' : 'sheet0.png';
      const code = sym.symbol.charCodeAt(0) - 0x21;
      const col = code % 16;
      const row = Math.floor(code / 16);
      const scale = displayW / SPRITE_CELL_W;
      const displayH = Math.round(SPRITE_CELL_H * scale);
      const bgW = Math.round(SPRITE_SHEET_W * scale);
      const bgH = Math.round(SPRITE_SHEET_H * scale);
      const bgX = -Math.round(col * SPRITE_CELL_W * scale);
      const bgY = -Math.round(row * SPRITE_CELL_H * scale);
      // display:inline-block + flex-shrink:0 keeps the icon sized correctly in both flex and block parents.
      const style = `display:inline-block;flex-shrink:0;width:${displayW}px;height:${displayH}px;background-image:url('${SPRITE_BASE}${sheet}');background-repeat:no-repeat;background-size:${bgW}px ${bgH}px;background-position:${bgX}px ${bgY}px;`;
      return `<span style="${style}"></span>`;
    }

    // ── Sidebar toggle (narrow viewports) ────────────────────────────
    const sidebar = document.getElementById('sidebar');
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // ── Station card ──────────────────────────────────────────────────
    function renderStationCard(cfg) {
      const aprs = cfg.aprs || {};
      const sym = (aprs.symbol && aprs.symbol.table && aprs.symbol.symbol)
        ? aprs.symbol
        : { table: '/', symbol: '#' };
      document.getElementById('station-symbol').innerHTML = symbolGlyphHTML(sym, 40);
      document.getElementById('station-callsign').textContent =
        aprs.callsign ? `${aprs.callsign}${aprs.ssid ? '-' + aprs.ssid : ''}` : 'Callsign not set';
      document.getElementById('station-comment').textContent = aprs.comment || '';

      const badges = [];
      if (aprs.digipeat_mode === 'digipeater') {
        const rules = (aprs.digipeat && aprs.digipeat.rules) || '';
        const suffix = rules === 'widearea' ? 'Wide' : rules === 'fillin' ? 'Fill in' : 'Custom';
        badges.push(`<span class="badge on">Digi: RX &amp; TX - ${suffix}</span>`);
      } else {
        badges.push(`<span class="badge">Digi: RX only</span>`);
      }
      const igateLabels = { off: 'IGate: Off', rxonly: 'IGate: RX only', rxtx: 'IGate: RX &amp; TX' };
      const igateOn = (aprs.igate_mode || 'off') !== 'off';
      badges.push(`<span class="badge${igateOn ? ' on' : ''}">${igateLabels[aprs.igate_mode] || 'IGate: Off'}</span>`);
      document.getElementById('station-badges').innerHTML = badges.join('');
    }

    // ── GPS card, backed by services/gps.py's gpsd client for live fix/satellite data ──
    let gpsPollTimer = null;
    let lastGpsUpdateAt = null;
    // Set by renderSystemStatusBody, read by renderGpsBody to explain a pending waiting_gps state.
    let lastDirewolfState = null;
    // Polled (not just re-rendered on click) so transient starting/stopping states from other tabs still show.
    const DIREWOLF_POLL_MS = 3000;
    const GPS_POLL_MS = 5000;
    const APRS_POLL_MS = 10000;

    // ── Heard-station selection, shared between the heard list and the dashboard map ──
    let selectedCallsign = null;
    // Latest /api/aprs/heard fetch, unfiltered -- either poller (list or markers) can refresh this.
    let allHeardStations = [];
    // allHeardStations filtered to the history-slider window; what the list/markers/trace actually use.
    let lastHeardStations = [];
    let historyHours = 24;
    // Set by initDashboardMap once the map/markers exist; station-selection helpers below no-op
    // until then (e.g. a list click before the map finishes loading).
    let dashboardMapInstance = null;
    let stationMarkers = new Map(); // callsign -> { marker, el }
    let homeLngLat = null;
    let selectedPopup = null;
    let selectedPopupCallsign = null;

    function filterByHistory(stations) {
      const cutoffS = historyHours * 3600;
      return stations.filter(s => s.seconds_ago <= cutoffS);
    }

    function selectStation(callsign) {
      selectedCallsign = (selectedCallsign === callsign) ? null : callsign;
      applyStationSelection();
    }

    function clearSelection() {
      if (selectedCallsign === null) return;
      selectedCallsign = null;
      applyStationSelection();
    }

    // Named digipeaters in station.path that we also have a position for, in path order --
    // skipping unknown hops (generic WIDEn-N aliases included, since those never appear as a
    // heard station's own callsign) rather than breaking the chain.
    function knownPathHops(station) {
      const hops = [];
      for (const hop of (station.path || [])) {
        const hopCall = hop.replace(/\*$/, '').toUpperCase();
        const hopStation = lastHeardStations.find(s => s.callsign.toUpperCase() === hopCall);
        if (hopStation && hopStation.latitude != null && hopStation.longitude != null) {
          hops.push(hopStation);
        }
      }
      return hops;
    }

    // null = no selection, every marker stays visible. Otherwise the set of callsigns that should
    // stay visible while everything else is hidden: the selected station plus its relay chain.
    function relevantCallsigns() {
      if (!selectedCallsign) return null;
      const station = lastHeardStations.find(s => s.callsign === selectedCallsign);
      const relevant = new Set([selectedCallsign]);
      if (station) for (const hop of knownPathHops(station)) relevant.add(hop.callsign);
      return relevant;
    }

    function applyStationSelection() {
      document.querySelectorAll('#heard-list .heard-row').forEach(row => {
        row.classList.toggle('selected', row.dataset.callsign === selectedCallsign);
      });
      const relevant = relevantCallsigns();
      for (const [callsign, { el }] of stationMarkers) {
        // display:none (not opacity) so a hidden marker is fully gone rather than an invisible
        // layer that can resurface mid-zoom/pan compositing.
        el.style.display = (!relevant || relevant.has(callsign)) ? '' : 'none';
      }
      if (selectedPopup && selectedPopupCallsign !== selectedCallsign) {
        selectedPopup.remove();
        selectedPopup = null;
        selectedPopupCallsign = null;
      }
      updateTraceLine();
      updateStationTrack();
    }

    // Creates/repositions/removes map markers to match lastHeardStations (post history-filter) --
    // called after every fetch and also directly by the history slider, no re-fetch needed for that.
    function syncStationMarkers() {
      if (!dashboardMapInstance) return;
      const relevant = relevantCallsigns();
      const seen = new Set();
      for (const s of lastHeardStations) {
        if (s.latitude == null || s.longitude == null) continue;
        seen.add(s.callsign);
        const lngLat = [s.longitude, s.latitude];
        const existing = stationMarkers.get(s.callsign);
        if (existing) {
          existing.marker.setLngLat(lngLat);
          existing.el.style.display = (!relevant || relevant.has(s.callsign)) ? '' : 'none';
          continue;
        }
        const sEl = document.createElement('div');
        sEl.style.cssText = 'width:28px;height:28px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));cursor:pointer;';
        sEl.innerHTML = symbolGlyphHTML(s.symbol, 28);
        if (relevant && !relevant.has(s.callsign)) {
          sEl.style.display = 'none';
        }
        sEl.addEventListener('click', (e) => {
          e.stopPropagation(); // keep the map's own background-click handler from also clearing this
          selectStation(s.callsign);
          if (selectedCallsign === s.callsign) showStationPopup(s.callsign);
        });
        stationMarkers.set(s.callsign, {
          marker: new maplibregl.Marker({ element: sEl }).setLngLat(lngLat).addTo(dashboardMapInstance),
          el: sEl,
        });
      }
      // Drops the marker for a callsign that fell out of the heard list (its DB row aged out, or
      // the history slider now excludes it).
      for (const [callsign, { marker }] of stationMarkers) {
        if (!seen.has(callsign)) {
          marker.remove();
          stationMarkers.delete(callsign);
        }
      }
      // The selected station itself dropped out -- clear selection rather than leaving every other
      // marker hidden with nothing left to be relative to.
      if (selectedCallsign && !seen.has(selectedCallsign)) {
        clearSelection();
      } else {
        updateTraceLine();
        updateStationTrack();
      }
    }

    // Draws a line from the selected station through its relay chain (knownPathHops) to this
    // station's own position.
    function updateTraceLine() {
      if (!dashboardMapInstance || !dashboardMapInstance.getSource('trace-line')) return;
      let coords = [];
      const station = lastHeardStations.find(s => s.callsign === selectedCallsign);
      if (station && station.latitude != null && station.longitude != null) {
        coords.push([station.longitude, station.latitude]);
        for (const hop of knownPathHops(station)) coords.push([hop.longitude, hop.latitude]);
        if (homeLngLat) coords.push(homeLngLat);
      }
      dashboardMapInstance.getSource('trace-line').setData({
        type: 'FeatureCollection',
        features: coords.length >= 2
          ? [{ type: 'Feature', geometry: { type: 'LineString', coordinates: coords }, properties: {} }]
          : [],
      });
    }

    // Selected station's own movement history (services/packet_log.py's station_track), re-fetched
    // on each selection change and each marker poll so a moving station's trail stays current.
    async function updateStationTrack() {
      if (!dashboardMapInstance || !dashboardMapInstance.getSource('station-track')) return;
      if (!selectedCallsign) {
        dashboardMapInstance.getSource('station-track').setData({ type: 'FeatureCollection', features: [] });
        return;
      }
      let points = [];
      try {
        const res = await fetch(`/api/aprs/station-track?callsign=${encodeURIComponent(selectedCallsign)}`);
        points = (await res.json()).points || [];
      } catch (e) {
        return;
      }
      const coords = points.map(p => [p.longitude, p.latitude]);
      dashboardMapInstance.getSource('station-track').setData({
        type: 'FeatureCollection',
        features: coords.length >= 2
          ? [{ type: 'Feature', geometry: { type: 'LineString', coordinates: coords }, properties: {} }]
          : [],
      });
    }

    function stationPopupHTML(station) {
      const pos = (station.latitude != null && station.longitude != null)
        ? `${station.latitude.toFixed(4)}, ${station.longitude.toFixed(4)}` : '-';
      const sig = station.signal_level != null ? String(station.signal_level) : '-';
      return `
        <div style="font-size:13px;line-height:1.5;min-width:160px;">
          <strong>${station.callsign}</strong><br>
          <span>Position: ${pos}</span><br>
          <span>Signal: ${sig}</span><br>
          <span>Heard: ${timeSinceLabel(new Date(Date.now() - station.seconds_ago * 1000))}</span>
          ${station.comment ? `<br><span>${station.comment}</span>` : ''}
        </div>
      `;
    }

    function showStationPopup(callsign) {
      if (!dashboardMapInstance) return;
      const station = lastHeardStations.find(s => s.callsign === callsign);
      if (!station || station.latitude == null || station.longitude == null) return;
      if (selectedPopup) selectedPopup.remove();
      selectedPopupCallsign = callsign;
      selectedPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: false })
        .setLngLat([station.longitude, station.latitude])
        .setHTML(stationPopupHTML(station))
        .addTo(dashboardMapInstance);
      selectedPopup.on('close', clearSelection);
    }

    function timeSinceLabel(date) {
      const s = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m}m ago`;
      return `${Math.round(m / 60)}h ago`;
    }

    function timeUntilLabel(seconds) {
      const s = Math.max(0, Math.round(seconds));
      if (s < 60) return `in ${s}s`;
      const m = Math.round(s / 60);
      if (m < 60) return `in ${m}m`;
      return `in ${Math.round(m / 60)}h`;
    }

    function renderGpsBody(gpsCfg, status) {
      const title = document.getElementById('gps-title');
      const body = document.getElementById('gps-body');
      if (gpsCfg.position_source === 'manual') {
        const hasPos = gpsCfg.latitude !== undefined && gpsCfg.longitude !== undefined && gpsCfg.latitude !== '' && gpsCfg.longitude !== '';
        const pos = hasPos ? `${parseFloat(gpsCfg.latitude).toFixed(5)}, ${parseFloat(gpsCfg.longitude).toFixed(5)}` : '-';
        title.innerHTML = `GPS: Manual <span class="gps-title-pos">${pos}</span>`;
        // Room below for more stats, if this ever grows beyond a fixed lat/lon.
        body.innerHTML = '';
        return;
      }
      title.textContent = 'GPS: Live';
      if (!status || !status.available) {
        body.innerHTML = `<div class="note">${(status && status.reason) || 'GPS not available.'}</div>`;
        return;
      }
      const pos = status.has_fix ? `${status.latitude.toFixed(5)}, ${status.longitude.toFixed(5)}` : 'No fix yet';
      lastGpsUpdateAt = new Date();
      const waitingNote = (!status.has_fix && lastDirewolfState === 'waiting_gps')
        ? '<div class="note">Direwolf is waiting for this fix to start.</div>'
        : '';
      body.innerHTML = `
        <div class="kv"><span class="k">Position</span><span class="v">${pos}</span></div>
        <div class="kv"><span class="k">Fix</span><span class="v">${status.fix}</span></div>
        <div class="kv"><span class="k">Signal</span><span class="v">${status.satellites_used ?? '-'} / ${status.satellites_visible ?? '-'} sats</span></div>
        <div class="kv"><span class="k">Last update</span><span class="v">${timeSinceLabel(lastGpsUpdateAt)}</span></div>
        ${waitingNote}
      `;
    }

    // ── UI theme toggle (page chrome only; the map has its own separate toggle) ──
    const UI_THEME_KEY = 'ui-theme';
    const THEME_CYCLE = [null, 'light', 'dark']; // null = follow system
    const THEME_LABELS = { null: 'Theme: System', light: 'Theme: Light', dark: 'Theme: Dark' };

    function applyUiTheme(theme) {
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      document.getElementById('theme-toggle').textContent = THEME_LABELS[theme];
    }

    let uiTheme = localStorage.getItem(UI_THEME_KEY);
    if (!THEME_CYCLE.includes(uiTheme)) uiTheme = null;
    applyUiTheme(uiTheme);

    document.getElementById('theme-toggle').addEventListener('click', () => {
      uiTheme = THEME_CYCLE[(THEME_CYCLE.indexOf(uiTheme) + 1) % THEME_CYCLE.length];
      if (uiTheme) localStorage.setItem(UI_THEME_KEY, uiTheme);
      else localStorage.removeItem(UI_THEME_KEY);
      applyUiTheme(uiTheme);
    });

    // ── Auth (login/config/logout buttons, gates Direwolf control), populated at boot ──
    let authState = { mode: 'none', logged_in: false };

    function renderAuthControls() {
      const canConfig = authState.mode === 'none' || authState.logged_in;
      const showLogin = authState.mode !== 'none' && !authState.logged_in;
      const showLogout = authState.mode !== 'none' && authState.logged_in;
      document.getElementById('btn-config').classList.toggle('hidden', !canConfig);
      document.getElementById('btn-history').classList.toggle('hidden', !canConfig);
      document.getElementById('btn-stats').classList.toggle('hidden', !canConfig);
      document.getElementById('btn-login').classList.toggle('hidden', !showLogin);
      document.getElementById('btn-logout').classList.toggle('hidden', !showLogout);
    }

    document.getElementById('btn-config').addEventListener('click', () => { location.href = '/config'; });
    document.getElementById('btn-history').addEventListener('click', () => { location.href = '/history'; });
    document.getElementById('btn-stats').addEventListener('click', () => { location.href = '/stats'; });
    document.getElementById('btn-login').addEventListener('click', () => { location.href = '/login'; });
    document.getElementById('btn-logout').addEventListener('click', async () => {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } finally {
        location.reload();
      }
    });

    // ── Confirm modal, reused for plain confirmations and the login-required prompt ──
    function confirmModal(text, { okLabel = 'Confirm', cancelLabel = 'Cancel', hideCancel = false } = {}) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('confirm-modal');
        const okBtn = document.getElementById('confirm-modal-ok');
        const cancelBtn = document.getElementById('confirm-modal-cancel');
        document.getElementById('confirm-modal-text').textContent = text;
        okBtn.textContent = okLabel;
        cancelBtn.textContent = cancelLabel;
        cancelBtn.classList.toggle('hidden', hideCancel);
        overlay.classList.remove('hidden');
        function cleanup(result) {
          overlay.classList.add('hidden');
          cancelBtn.classList.remove('hidden');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          resolve(result);
        }
        function onOk() { cleanup(true); }
        function onCancel() { cleanup(false); }
        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
      });
    }

    // ── Direwolf status/control badge, reflects services/system.py's real or simulated state ──
    const DIREWOLF_STATE_LABELS = {
      running: 'Running',
      starting: 'Starting',
      waiting_gps: 'Waiting for GPS fix',
      standby: 'Standby',
      stopping: 'Stopping',
      error: 'Error',
    };

    async function toggleDirewolf(status) {
      const wantRunning = !status.running;
      // mode 'none' has no login gate, so confirm here as a safety net against stray clicks.
      if (authState.mode === 'none') {
        const ok = await confirmModal(`${wantRunning ? 'Start' : 'Stop'} Direwolf?`);
        if (!ok) return;
      }
      // Failure surfaces via the badge's error state and log modal.
      try {
        await fetch(`/api/system/direwolf/${wantRunning ? 'start' : 'stop'}`, { method: 'POST' });
      } catch (e) {
        // Server unreachable; the badge poll will reflect whatever state comes back.
      }
      renderSystemStatusBody();
    }

    async function renderSystemStatusBody() {
      const badgeSlot = document.getElementById('direwolf-badge-slot');

      let status;
      try {
        status = await (await fetch('/api/system/direwolf/status')).json();
      } catch (e) {
        return; // one missing badge isn't worth a dedicated error state
      }
      lastDirewolfState = status.state;
      const canControl = authState.mode === 'none' || authState.logged_in;
      // "simulated" means no real direwolf.service exists yet; an in-memory stand-in for testing the UX.
      const stateLabel = DIREWOLF_STATE_LABELS[status.state] || status.state || 'Standby';
      const label = 'System: ' + stateLabel + (status.simulated ? ' (sim)' : '');
      // Error detail lives in the log modal, opened via showDirewolfLogs.
      const title = status.state === 'error'
        ? 'Click to view logs'
        : status.simulated ? 'No direwolf.service installed yet. This toggles an in-memory simulated state for UI testing only.' : '';
      // Single-assignment replace avoids flickering the button out on every poll.
      const isPending = status.state === 'starting' || status.state === 'stopping' || status.state === 'waiting_gps';
      const badgeClass = `badge${status.state === 'running' ? ' on' : ''}${status.state === 'error' ? ' error' : ''}${isPending ? ' pending' : ''}`;
      // Always clickable; logged-out readonly/full mode shows a "log in first" modal instead of disabling it.
      badgeSlot.innerHTML = `<button type="button" class="${badgeClass}" id="direwolf-toggle" title="${title}">${label}</button>`;
      document.getElementById('direwolf-toggle').addEventListener('click', async () => {
        if (status.state === 'error') {
          showDirewolfLogs(status, canControl);
          return;
        }
        if (!canControl) {
          const ok = await confirmModal('Log in to change state', { okLabel: 'Log in', cancelLabel: 'Cancel' });
          if (ok) location.href = '/login';
          return;
        }
        toggleDirewolf(status);
      });
    }

    // ── Direwolf log modal, opened by the error badge instead of showing raw error text ──
    async function showDirewolfLogs(status, canControl) {
      const overlay = document.getElementById('log-modal');
      const pre = document.getElementById('log-modal-text');
      pre.textContent = 'Loading logs…';
      overlay.classList.remove('hidden');
      try {
        const res = await fetch('/api/system/direwolf/logs');
        const data = await res.json();
        pre.textContent = data.logs || 'No log output.';
      } catch (e) {
        pre.textContent = 'Could not reach the server.';
      }

      const closeBtn = document.getElementById('log-modal-close');
      const retryBtn = document.getElementById('log-modal-retry');
      retryBtn.classList.toggle('hidden', !canControl);
      function cleanup() {
        overlay.classList.add('hidden');
        closeBtn.removeEventListener('click', onClose);
        retryBtn.removeEventListener('click', onRetry);
      }
      function onClose() { cleanup(); }
      function onRetry() { cleanup(); toggleDirewolf(status); }
      closeBtn.addEventListener('click', onClose);
      retryBtn.addEventListener('click', onRetry);
    }

    // ── Beacon stats card (services/packet_log.py's journal tail); whole minutes since this only polls every APRS_POLL_MS (10s) ──
    function beaconMinutesLabel(seconds) {
      const s = Math.max(0, Math.round(seconds));
      return s < 60 ? '<1min' : `${Math.floor(s / 60)}min`;
    }

    function beaconStatRows(label, enabled, lastAgo, intervalS) {
      if (!enabled) {
        return `<div class="kv"><span class="k">${label}</span><span class="v">Disabled</span></div>`;
      }
      if (lastDirewolfState !== 'running') {
        return `<div class="kv"><span class="k">${label}</span><span class="v">Not active</span></div>`;
      }
      if (lastAgo === null || lastAgo === undefined) {
        return `<div class="kv"><span class="k">${label}</span><span class="v">None yet</span></div>`;
      }
      const remaining = intervalS - lastAgo;
      const next = remaining <= 0 ? 'Due' : beaconMinutesLabel(remaining);
      return `<div class="kv"><span class="k">${label}</span><span class="v">Last: ${beaconMinutesLabel(lastAgo)}&nbsp;&nbsp;&nbsp;Next: ${next}</span></div>`;
    }

    async function renderBeaconStatsBody(cfg) {
      const card = document.getElementById('beacon-stats-card');
      const aprs = cfg.aprs || {};
      if (!aprs.callsign) {
        card.classList.add('hidden');
        return;
      }
      card.classList.remove('hidden');
      // RF and IGate beacons each keep their own config block.
      const rfBeacon = aprs.rf_beacon || {};
      const igBeacon = aprs.igate_beacon || {};
      const rfEnabled = aprs.digipeat_mode === 'digipeater' && !!rfBeacon.enabled;
      const igateEnabled = (aprs.igate_mode || 'off') !== 'off' && !!igBeacon.enabled;
      const rfIntervalS = (rfBeacon.interval || 30) * 60;
      const igIntervalS = (igBeacon.interval || 30) * 60;
      let stats = { enabled: true, last_rf_beacon_seconds_ago: null, last_igate_beacon_seconds_ago: null };
      try {
        stats = await (await fetch('/api/aprs/beacon-stats')).json();
      } catch (e) {
        // leave the card showing its previous contents on a transient fetch failure
        return;
      }
      if (stats.enabled === false) {
        document.getElementById('beacon-stats-body').innerHTML =
          `<div class="note">Sent-packet logging is off (Settings &gt; Database), so beacon timing can't be tracked.</div>`;
        return;
      }
      document.getElementById('beacon-stats-body').innerHTML =
        beaconStatRows('RF', rfEnabled, stats.last_rf_beacon_seconds_ago, rfIntervalS) +
        beaconStatRows('IGate', igateEnabled, stats.last_igate_beacon_seconds_ago, igIntervalS);
    }

    // ── Heard stations card: same live source as the beacon stats above. ──
    async function renderHeardStations() {
      let data;
      try {
        data = await (await fetch('/api/aprs/heard')).json();
      } catch (e) {
        return; // leave the list showing its previous contents
      }
      if (data.enabled === false) {
        document.getElementById('heard-list').innerHTML =
          `<div class="note">Heard-station logging is off (Settings &gt; Database).</div>`;
        return;
      }
      allHeardStations = data.stations || [];
      renderHeardListFromCache();
    }

    // Re-renders from the last fetch, no network round-trip -- used by the poll above and by the
    // history slider so dragging it feels instant.
    function renderHeardListFromCache() {
      const list = document.getElementById('heard-list');
      const stations = filterByHistory(allHeardStations);
      lastHeardStations = stations;
      if (stations.length === 0) {
        list.innerHTML = `<div class="note">No stations heard ${historyHours < 24 ? 'in this window' : 'yet'}.</div>`;
        updateTraceLine();
        updateStationTrack();
        return;
      }
      list.innerHTML = stations.map(s => `
        <div class="heard-row${s.callsign === selectedCallsign ? ' selected' : ''}" data-callsign="${s.callsign}">
          <span class="heard-icon">${symbolGlyphHTML(s.symbol, 20)}</span>
          <span class="heard-call">${s.callsign}</span>
          <span class="heard-count">×${s.count}</span>
          <span class="heard-time">${timeSinceLabel(new Date(Date.now() - s.seconds_ago * 1000))}</span>
        </div>
      `).join('');
      updateTraceLine();
    }

    // Delegated so it keeps working across renderHeardStations()'s innerHTML replacements -- no
    // popup here, just the list highlight/map-dim/trace that selectStation() already does.
    document.getElementById('heard-list').addEventListener('click', (e) => {
      const row = e.target.closest('.heard-row');
      if (row) selectStation(row.dataset.callsign);
    });

    // Re-applies instantly from the cached fetch -- no need to wait for the next poll.
    const historySlider = document.getElementById('history-slider');
    historySlider.addEventListener('input', () => {
      historyHours = parseInt(historySlider.value, 10);
      document.getElementById('history-slider-label').textContent = `${historyHours}h`;
      renderHeardListFromCache();
      syncStationMarkers();
    });

    // ── Home-location map ─────────────────────────────────────────────
    async function initDashboardMap(cfg, worldAvailable, regionAvailable, online) {
      const mapUnavailable = document.getElementById('map-unavailable');
      if (!online && !worldAvailable && !regionAvailable) {
        mapUnavailable.classList.remove('hidden');
        return;
      }

      // Home point: manual position wins, then live GPS fix, then region center, else none.
      let homeLat = null, homeLon = null;
      const gpsCfg = cfg.gps || {};
      const mapCfg = cfg.map || {};
      if (gpsCfg.position_source === 'manual' && gpsCfg.latitude && gpsCfg.longitude) {
        homeLat = parseFloat(gpsCfg.latitude);
        homeLon = parseFloat(gpsCfg.longitude);
      } else {
        try {
          const res = await fetch('/api/gps/position');
          const data = await res.json();
          if (data.available) {
            homeLat = data.latitude;
            homeLon = data.longitude;
          }
        } catch (e) {
          // Falls through to the region-center fallback below.
        }
      }
      if (homeLat === null && mapCfg.north !== undefined && mapCfg.south !== undefined) {
        homeLat = (parseFloat(mapCfg.north) + parseFloat(mapCfg.south)) / 2;
        homeLon = (parseFloat(mapCfg.east) + parseFloat(mapCfg.west)) / 2;
      }
      const center = [homeLon ?? 0, homeLat ?? 0];

      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);

      // Streams live tiles when online, else falls back to cached region/world pmtiles (can't mix sources).
      const pmtilesFile = online ? 'live.pmtiles' : (regionAvailable ? 'region.pmtiles' : 'world.pmtiles');
      const pmtilesUrl = `pmtiles://${location.origin}/map-data/${pmtilesFile}`;

      // Map's own theme toggle, tracked independently from the page's UI theme toggle.
      const MAP_THEME_KEY = 'map-theme';
      const MAP_THEME_LABELS = { null: 'Map: System', light: 'Map: Light', dark: 'Map: Dark' };
      let mapTheme = localStorage.getItem(MAP_THEME_KEY);
      if (!THEME_CYCLE.includes(mapTheme)) mapTheme = null;

      function resolveMapDark(theme) {
        if (theme === 'light') return false;
        if (theme === 'dark') return true;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      async function buildMapStyle(dark) {
        const styleUrl = `/static/maplibre/style-${dark ? 'dark' : 'light'}.json`;
        const s = await (await fetch(styleUrl)).json();
        s.sources.protomaps.url = pmtilesUrl;
        return s;
      }

      const map = new maplibregl.Map({
        container: 'dashboard-map',
        style: await buildMapStyle(resolveMapDark(mapTheme)),
        center,
        zoom: homeLat !== null ? 12 : 1,
      });
      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      // Custom MapLibre IControl, top-left to stay clear of the NavigationControl at top-right.
      class MapThemeControl {
        onAdd(mapInstance) {
          this._container = document.createElement('div');
          this._container.className = 'maplibregl-ctrl maplibregl-ctrl-group';
          const btn = document.createElement('button');
          btn.type = 'button';
          // Explicit black-on-white to match MapLibre's other native controls and avoid white-on-white text in dark mode.
          btn.style.cssText = 'width:auto;padding:0 10px;font-size:12px;font-family:inherit;white-space:nowrap;color:#333;background:#fff;';
          btn.textContent = MAP_THEME_LABELS[mapTheme];
          btn.addEventListener('click', async () => {
            mapTheme = THEME_CYCLE[(THEME_CYCLE.indexOf(mapTheme) + 1) % THEME_CYCLE.length];
            if (mapTheme) localStorage.setItem(MAP_THEME_KEY, mapTheme);
            else localStorage.removeItem(MAP_THEME_KEY);
            btn.textContent = MAP_THEME_LABELS[mapTheme];
            mapInstance.setStyle(await buildMapStyle(resolveMapDark(mapTheme)));
          });
          this._container.appendChild(btn);
          return this._container;
        }
        onRemove() {
          this._container.parentNode.removeChild(this._container);
        }
      }
      map.addControl(new MapThemeControl(), 'top-left');

      await new Promise(resolve => map.on('load', resolve));
      dashboardMapInstance = map;

      // Background click (not caught by a marker's own listener below) clears the selection.
      map.on('click', clearSelection);

      // Resolved once since MapLibre paint properties need a real color, not a CSS custom property.
      const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2563eb';
      const mutedColor = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#888';
      map.addSource('trace-line', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'trace-line-layer',
        type: 'line',
        source: 'trace-line',
        paint: { 'line-color': accentColor, 'line-width': 2.5, 'line-dasharray': [2, 1.5] },
      });
      // Selected station's own past positions -- solid/muted so it reads as "history", distinct
      // from the dashed accent-colored relay chain above.
      map.addSource('station-track', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'station-track-layer',
        type: 'line',
        source: 'station-track',
        paint: { 'line-color': mutedColor, 'line-width': 2, 'line-opacity': 0.7 },
      });

      if (homeLat !== null) {
        homeLngLat = center;
        // Ring outline distinguishes the home marker from heard-station markers of the same size.
        const el = document.createElement('div');
        el.style.cssText = 'width:34px;height:34px;border-radius:50%;border:3px solid var(--accent);box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:transparent;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.5));';
        const aprs = cfg.aprs || {};
        const sym = (aprs.symbol && aprs.symbol.table && aprs.symbol.symbol) ? aprs.symbol : { table: '/', symbol: '#' };
        el.innerHTML = symbolGlyphHTML(sym, 28);
        new maplibregl.Marker({ element: el }).setLngLat(center).addTo(map);
      }

      // Heard-station markers, kept one per callsign and refreshed on the same interval as the
      // heard-stations list, so a station heard after the map first loaded still gets a marker.
      async function updateStationMarkers() {
        let data;
        try {
          data = await (await fetch('/api/aprs/heard')).json();
        } catch (e) {
          return;
        }
        allHeardStations = data.stations || [];
        lastHeardStations = filterByHistory(allHeardStations);
        syncStationMarkers();
      }
      await updateStationMarkers();
      setInterval(updateStationMarkers, APRS_POLL_MS);
    }

    // ── Boot ──────────────────────────────────────────────────────────
    (async () => {
      try {
        authState = await (await fetch('/api/auth/status')).json();
      } catch (e) {
        authState = { mode: 'none', logged_in: false };
      }
      renderAuthControls();

      try {
        const status = await (await fetch('/api/status')).json();
        if (status.autostart_skipped_notice) {
          confirmModal(
            'First boot autostart disabled to allow for advanced config, subsequent boots will have autostart enabled',
            { okLabel: 'OK', hideCancel: true },
          );
        }
      } catch (e) {}

      let cfg = {};
      try {
        const res = await fetch('/api/config');
        if (res.ok) cfg = await res.json();
      } catch (e) {
        // Falls through to an empty cfg; every card below handles a missing/partial cfg.
      }

      renderStationCard(cfg);
      renderSystemStatusBody();
      setInterval(renderSystemStatusBody, DIREWOLF_POLL_MS);
      renderBeaconStatsBody(cfg);
      setInterval(() => renderBeaconStatsBody(cfg), APRS_POLL_MS);
      renderHeardStations();
      setInterval(renderHeardStations, APRS_POLL_MS);

      const gpsCfg = cfg.gps || {};
      if (gpsCfg.position_source === 'manual') {
        renderGpsBody(gpsCfg, null);
      } else {
        async function pollGps() {
          try {
            const res = await fetch('/api/gps/status');
            renderGpsBody(gpsCfg, await res.json());
          } catch (e) {
            renderGpsBody(gpsCfg, { available: false, reason: 'Could not reach the server.' });
          }
        }
        await pollGps();
        gpsPollTimer = setInterval(pollGps, GPS_POLL_MS);
      }

      let worldAvailable = false, regionAvailable = false, online = false;
      try {
        worldAvailable = (await (await fetch('/api/map/world-status')).json()).available;
      } catch (e) {}
      try {
        regionAvailable = (await (await fetch('/api/map/region-status')).json()).available;
      } catch (e) {}
      try {
        online = (await (await fetch('/api/network/internet')).json()).online;
      } catch (e) {}

      initDashboardMap(cfg, worldAvailable, regionAvailable, online);
    })();
  </script>
