        getCurrentRow.classList.toggle('hidden', !isManual);
        getCurrentBtn.disabled = !hasDevice;
        timeSyncCheckbox.disabled = !hasDevice;
        if (!hasDevice) timeSyncCheckbox.checked = false;
        timezoneField.classList.toggle('hidden', !timeSyncCheckbox.checked);
        statusField.classList.toggle('hidden', !hasDevice);
      }

      deviceSelect.addEventListener('change', updateGpsVisibility);
      sourceSelect.addEventListener('change', updateGpsVisibility);
      timeSyncCheckbox.addEventListener('change', updateGpsVisibility);

      getCurrentBtn.addEventListener('click', async () => {
        const msg = document.getElementById('gps-getcurrent-msg');
        const prevText = getCurrentBtn.textContent;
        getCurrentBtn.disabled = true;
        getCurrentBtn.textContent = 'Getting position…';
        msg.className = 'msg';
        try {
          const res = await fetch('/api/gps/position');
          const data = await res.json();
          if (data.available) {
            setManualFields(formatSelect.value, { lat: data.latitude, lon: data.longitude });
            updateLocPreview();
            msg.textContent = 'Position filled in from GPS.';
            msg.className = 'msg success';
          } else {
            msg.textContent = data.reason || 'No GPS fix available.';
            msg.className = 'msg error';
          }
        } catch (e) {
          msg.textContent = 'Could not reach the server.';
          msg.className = 'msg error';
        } finally {
          getCurrentBtn.disabled = deviceSelect.value === 'none';
          getCurrentBtn.textContent = prevText;
        }
      });

      document.getElementById('btn-gps-refresh').addEventListener('click', refreshGpsStatus);

      async function refreshGpsStatus() {
        const box = document.getElementById('gps-status-box');
        box.textContent = 'Checking…';
        try {
          const res = await fetch('/api/gps/status');
          const data = await res.json();
          if (!data.available) {
            box.textContent = data.reason || 'GPS not available.';
            return;
          }
          const sats = `${data.satellites_used ?? '?'} used / ${data.satellites_visible ?? '?'} visible`;
          const pos = data.has_fix ? `${data.latitude.toFixed(6)}, ${data.longitude.toFixed(6)}` : 'N/A';
          box.innerHTML = '';
          [['Fix', data.fix], ['Position', pos], ['Satellites', sats]].forEach(([label, value]) => {
            const row = document.createElement('div');
            const l = document.createElement('strong');
            l.textContent = `${label}: `;
            row.append(l, value);
            box.appendChild(row);
          });
        } catch (e) {
          box.textContent = 'Could not reach the server.';
        }
      }

      async function loadGpsDevices() {
        try {
          const res = await fetch('/api/hardware/serial-devices');
          const data = await res.json();
          (data.devices || []).forEach(d => {
            const label = d.description ? `${d.device}: ${d.description}` : d.device;
            addOption(deviceSelect, `serial:${d.device}`, label);
          });
          if (g.device) deviceSelect.value = g.device;
        } catch (e) {
          // "No GPS" still works
        } finally {
          updateGpsVisibility();
          if (deviceSelect.value !== 'none') refreshGpsStatus();
        }
      }

      async function loadTimezones() {
        const tzSelect = document.getElementById('gps-timezone');
        try {
          const res = await fetch('/api/system/timezones');
          const data = await res.json();
          (data.timezones || []).forEach(tz => addOption(tzSelect, tz, tz));
        } catch (e) {
          addOption(tzSelect, 'UTC', 'UTC');
        }
        if (g.timezone) tzSelect.value = g.timezone;
      }

      // Restore anything entered earlier, re-deriving the display fields from stored decimal degrees
      sourceSelect.value = g.position_source || 'manual';
      const savedFormat = g.location_format || 'decimal';
      formatSelect.value = savedFormat;
      formatSelect.dataset.prev = savedFormat;
      if (g.latitude !== undefined && g.longitude !== undefined && g.latitude !== '' && g.longitude !== '') {
        const latLon = { lat: parseFloat(g.latitude), lon: parseFloat(g.longitude) };
        document.getElementById('gps-lat').value = latLon.lat.toFixed(6);
        document.getElementById('gps-lon').value = latLon.lon.toFixed(6);
        setManualFields(savedFormat, latLon);
      }
      timeSyncCheckbox.checked = !!g.time_sync;

      loadGpsDevices();
      loadTimezones();
      updateGpsVisibility();
      updateFormatVisibility();
      updateLocPreview();
    }

    function saveGpsStep() {
      const positionSource = document.getElementById('gps-position-source').value;
      let latitude = '', longitude = '';
      if (positionSource === 'manual') {
        const latLon = getManualLatLon();
        if (!latLon) {
          const msg = document.getElementById('gps-loc-msg');
          msg.textContent = 'Enter a valid position before continuing.';
          msg.className = 'msg error';
          return false;
        }
        latitude = latLon.lat;
        longitude = latLon.lon;
      }
      wizardData.gps = {
        device: document.getElementById('gps-device').value,
        position_source: positionSource,
        location_format: document.getElementById('gps-loc-format').value,
        latitude,
        longitude,
        time_sync: document.getElementById('gps-time-sync').checked,
        timezone: document.getElementById('gps-timezone').value,
      };
      return true;
    }

    // ── Map caching step ─────────────────────────────────────────────
    // Downloads happen live in the wizard, straight to disk; entirely optional, never blocks Next
    const MAP_DEFAULT_RADIUS_KM = 50;
    // Min zoom fixed at 1; the download always extracts a full pyramid from 0 (matches pmtiles CLI)
    const MAP_MIN_ZOOM = 1;
    const MAP_SLIDER_MAX_ZOOM = 15; // matches Protomaps' hosted planet build, which only goes to z15
    const MAP_DEFAULT_MAX_ZOOM = 10;
    // Off-peak default so a background download doesn't compete with RF/APRS traffic
    const MAP_DEFAULT_AUTO_UPDATE_TIME = '03:00';
    let mapStatusPollTimer = null;
    // Module-level so showStep() can tear down the WebGL context on navigation
    let currentRegionMap = null;
    // Registered once globally on first use, not per-render
    let pmtilesProtocolRegistered = false;
    // Module-level so saveMapStep() can read the region after renderMapStep()'s closure has exited
    let mapRegionBounds = null;

    function renderMapStep() {
      const m = wizardData.map || {};
      document.getElementById('step-content').innerHTML = `
        <section>
          <p class="msg" id="map-checking-msg">Checking map caching status…</p>

          <div id="map-unavailable-warning" class="hidden">
            <p class="msg error">Map caching isn't available on this device.</p>
            <p class="hint">The world map wasn't cached during install: either there was no internet at the time, or it was skipped. You can still finish setup; this feature just won't be usable until that's fixed (see PINOUT.md/SETUP.md for re-running the install step).</p>
          </div>

          <div id="map-fields" class="hidden">
            <p class="msg error hidden" id="map-offline-note">No internet found. The pre-cached map below will still work, but downloading a more detailed region needs an internet connection.</p>

            <label>Region ${helpIcon("Drag the pin (or click anywhere) to move the whole region. Drag the small squares on each edge to resize it: drag one side to make it a rectangle instead of a square. Shown on the pre-cached world map, so this works even without internet.")}</label>
            <div id="map-region-picker" style="height: 320px; border-radius: 8px; overflow: hidden; margin-bottom: 12px;"></div>

            <button type="button" id="btn-map-use-station">Use station location</button>

            <div class="field">
              <label for="map-zoom-max">Detail level: zoom <span id="map-zoom-max-value"></span></label>
              <input type="range" id="map-zoom-max" min="${MAP_MIN_ZOOM}" max="${MAP_SLIDER_MAX_ZOOM}" value="${m.zoom_max ?? MAP_DEFAULT_MAX_ZOOM}">
            </div>

            <p class="msg" id="map-region-msg"></p>

            <button type="button" id="btn-map-download" style="margin-top: 12px;">Download this region</button>${helpIcon("Size depends on how much map detail actually exists in this area (a city and open countryside at the same size/zoom can differ hugely), so there's no reliable estimate to show before downloading. You'll see real progress once it starts.")}
            <button type="button" id="btn-map-cancel" class="hidden" style="margin-top: 8px;">Cancel download</button>

            <div id="map-progress-wrap" class="hidden" style="margin-top: 12px;">
              <div class="status-box" id="map-progress-msg"></div>
              <p class="hint">You can continue with the rest of the wizard. It'll keep downloading in the background. The Finish step will wait for it to complete before letting you save and reboot.</p>
            </div>
          </div>
        </section>
      `;

      const downloadBtn = document.getElementById('btn-map-download');
      const cancelBtn = document.getElementById('btn-map-cancel');
      const useStationBtn = document.getElementById('btn-map-use-station');
      const regionMsg = document.getElementById('map-region-msg');
      const offlineNote = document.getElementById('map-offline-note');
      const progressWrap = document.getElementById('map-progress-wrap');
      const progressMsg = document.getElementById('map-progress-msg');

      // mapRegionBounds is module-level so saveMapStep() can read it after this closure is gone
      let regionMarker = null;
      let edgeHandleN = null, edgeHandleS = null, edgeHandleE = null, edgeHandleW = null;
      let interactive = false;

      // Flat-earth approximation used client-side only to seed the initial box size
      function boundsFromRadius(lat, lon, radiusKm) {
        const latDelta = radiusKm / 111.0;
        const lonDelta = radiusKm / (111.0 * Math.max(Math.cos(lat * Math.PI / 180), 0.01));
        return { north: lat + latDelta, south: lat - latDelta, east: lon + lonDelta, west: lon - lonDelta };
      }

      // MapLibre has no rectangle helper, so the region box is a GeoJSON polygon (lon,lat order)
      function rectGeoJSON(b) {
        return {
          type: 'Feature',
          geometry: {
            type: 'Polygon',
            coordinates: [[
              [b.west, b.south], [b.east, b.south], [b.east, b.north], [b.west, b.north], [b.west, b.south],
            ]],
          },
        };
      }

      // Redraws the rectangle, center pin, and edge handles from mapRegionBounds
      function redrawRegion() {
        if (!currentRegionMap || !mapRegionBounds) return;
        const b = mapRegionBounds;
        const centerLat = (b.north + b.south) / 2;
        const centerLon = (b.east + b.west) / 2;
        regionMarker.setLngLat([centerLon, centerLat]);
        const src = currentRegionMap.getSource('region-rect');
        if (src) src.setData(rectGeoJSON(b));
        edgeHandleN.setLngLat([centerLon, b.north]);
        edgeHandleS.setLngLat([centerLon, b.south]);
        edgeHandleE.setLngLat([b.east, centerLat]);
        edgeHandleW.setLngLat([b.west, centerLat]);
      }

      // Moves the whole box by the same delta, used by dragging the pin or clicking the map
      function recenterTo(lat, lon, panMap) {
        const b = mapRegionBounds;
        const centerLat = (b.north + b.south) / 2;
        const centerLon = (b.east + b.west) / 2;
        const dLat = lat - centerLat;
        const dLon = lon - centerLon;
        b.north += dLat; b.south += dLat;
        b.east += dLon; b.west += dLon;
        if (currentRegionMap && panMap) currentRegionMap.easeTo({ center: [lon, lat] });
        redrawRegion();
      }

      // Region editing needs a connection to Protomaps' build host; viewing the cached map doesn't
      function setInteractive(enabled) {
        interactive = enabled;
        offlineNote.classList.toggle('hidden', enabled);
        downloadBtn.disabled = !enabled;
        if (regionMarker) regionMarker.setDraggable(enabled);
        [edgeHandleN, edgeHandleS, edgeHandleE, edgeHandleW].forEach(h => h && h.setDraggable(enabled));
      }

      function makeEdgeHandle(lngLat, axisClass) {
        const el = document.createElement('div');
        el.className = `map-edge-handle ${axisClass}`;
        return new maplibregl.Marker({ element: el, draggable: interactive }).setLngLat(lngLat).addTo(currentRegionMap);
      }

      // Builds the map from Protomaps' vendored style, pointed at local world.pmtiles, no internet needed
      async function initRegionMap(bounds) {
        mapRegionBounds = bounds;
        const b = bounds;
        const centerLat = (b.north + b.south) / 2;
        const centerLon = (b.east + b.west) / 2;

        if (!pmtilesProtocolRegistered) {
          const protocol = new pmtiles.Protocol();
          maplibregl.addProtocol('pmtiles', protocol.tile);
          pmtilesProtocolRegistered = true;
        }

        // Follows the page's own UI theme toggle rather than a separate map control
        const uiIsDark = uiTheme === 'dark' || (uiTheme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const styleUrl = `/static/maplibre/style-${uiIsDark ? 'dark' : 'light'}.json`;
        const style = await (await fetch(styleUrl)).json();
        style.sources.protomaps.url = `pmtiles://${location.origin}/map-data/world.pmtiles`;

        currentRegionMap = new maplibregl.Map({
          container: 'map-region-picker',
          style,
          center: [centerLon, centerLat],
          zoom: 6,
        });

        await new Promise(resolve => currentRegionMap.on('load', resolve));

        currentRegionMap.addSource('region-rect', { type: 'geojson', data: rectGeoJSON(b) });
        currentRegionMap.addLayer({
          id: 'region-rect-fill', type: 'fill', source: 'region-rect',
          paint: { 'fill-color': '#4fb3a9', 'fill-opacity': 0.15 },
        });
        currentRegionMap.addLayer({
          id: 'region-rect-line', type: 'line', source: 'region-rect',
          paint: { 'line-color': '#4fb3a9', 'line-width': 2 },
        });

        regionMarker = new maplibregl.Marker({ draggable: interactive }).setLngLat([centerLon, centerLat]).addTo(currentRegionMap);
        regionMarker.on('dragend', () => {
          const { lat, lng } = regionMarker.getLngLat();
          recenterTo(lat, lng, false);
        });
        currentRegionMap.on('click', (e) => {
          if (!interactive) return;
          recenterTo(e.lngLat.lat, e.lngLat.lng, false);
        });

        edgeHandleN = makeEdgeHandle([centerLon, b.north], 'ns');
        edgeHandleS = makeEdgeHandle([centerLon, b.south], 'ns');
        edgeHandleE = makeEdgeHandle([b.east, centerLat], 'ew');
        edgeHandleW = makeEdgeHandle([b.west, centerLat], 'ew');

        // Each handle only moves its own edge; MIN_GAP_DEG stops the box inverting on overdrag
        const MIN_GAP_DEG = 0.001;
        edgeHandleN.on('drag', () => {
          mapRegionBounds.north = Math.max(edgeHandleN.getLngLat().lat, mapRegionBounds.south + MIN_GAP_DEG);
          redrawRegion();
        });
        edgeHandleS.on('drag', () => {
          mapRegionBounds.south = Math.min(edgeHandleS.getLngLat().lat, mapRegionBounds.north - MIN_GAP_DEG);
          redrawRegion();
        });
        edgeHandleE.on('drag', () => {
          mapRegionBounds.east = Math.max(edgeHandleE.getLngLat().lng, mapRegionBounds.west + MIN_GAP_DEG);
          redrawRegion();
        });
        edgeHandleW.on('drag', () => {
          mapRegionBounds.west = Math.min(edgeHandleW.getLngLat().lng, mapRegionBounds.east - MIN_GAP_DEG);
          redrawRegion();
        });
      }

      const zoomMaxInput = document.getElementById('map-zoom-max');
      const zoomMaxValue = document.getElementById('map-zoom-max-value');
      function updateZoomLabel() {
        zoomMaxValue.textContent = zoomMaxInput.value;
      }
      updateZoomLabel();
      zoomMaxInput.addEventListener('input', updateZoomLabel);

      // Not gated on interactive: only reads a locally-known position, no internet involved
      useStationBtn.addEventListener('click', async () => {
        const g = wizardData.gps || {};
        if (g.position_source === 'manual' && g.latitude && g.longitude) {
          recenterTo(parseFloat(g.latitude), parseFloat(g.longitude), true);
          return;
        }
        try {
          const res = await fetch('/api/gps/position');
          const data = await res.json();
          if (data.available) {
            recenterTo(data.latitude, data.longitude, true);
          } else {
            regionMsg.textContent = data.reason || 'No station position available.';
          }
        } catch (e) {
          regionMsg.textContent = 'Could not reach the server.';
        }
      });

      // Progress is read from the growing size of the output file, not tile counts
      function pollDownloadStatus() {
        mapStatusPollTimer = setInterval(async () => {
          try {
            const res = await fetch('/api/map/cache/status');
            const data = await res.json();
            const elapsed = data.elapsed_s !== null ? formatDuration(data.elapsed_s) : '';
            if (data.active) {
              progressMsg.textContent = `Downloading… ${formatBytes(data.bytes)} so far${elapsed ? ` (${elapsed} elapsed)` : ''}`;
              return;
            }
            clearInterval(mapStatusPollTimer);
            mapStatusPollTimer = null;
            downloadBtn.disabled = !interactive;
            cancelBtn.classList.add('hidden');
            if (data.cancelled) {
              progressMsg.textContent = 'Cancelled.';
            } else if (data.error) {
              progressMsg.textContent = `Failed: ${data.error}`;
            } else if (data.done) {
              progressMsg.textContent = `Done: ${formatBytes(data.bytes)} downloaded${elapsed ? ` in ${elapsed}` : ''}.`;
            }
          } catch (e) {
            // Transient. Next poll tries again.
          }
        }, 1000);
      }

      downloadBtn.addEventListener('click', async () => {
        if (!mapRegionBounds || !interactive) return;
        const zoomMax = parseInt(document.getElementById('map-zoom-max').value, 10);
        downloadBtn.disabled = true;
        progressWrap.classList.remove('hidden');
        progressMsg.textContent = 'Starting…';
        try {
          const res = await fetch('/api/map/cache/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...mapRegionBounds, zoom_max: zoomMax }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            progressMsg.textContent = err.detail || 'Failed to start download.';
            downloadBtn.disabled = !interactive;
            return;
          }
          cancelBtn.classList.remove('hidden');
          pollDownloadStatus();
        } catch (e) {
          progressMsg.textContent = 'Could not reach the server.';
          downloadBtn.disabled = !interactive;
        }
      });

      cancelBtn.addEventListener('click', async () => {
        cancelBtn.disabled = true;
        try {
          await fetch('/api/map/cache/cancel', { method: 'POST' });
        } finally {
          cancelBtn.disabled = false;
        }
      });

      (async () => {
        const checkingMsg = document.getElementById('map-checking-msg');
        const unavailableWarning = document.getElementById('map-unavailable-warning');
        const mapFields = document.getElementById('map-fields');

        // The world cache must exist, otherwise there's no local basemap to render
        let worldAvailable = false;
        try {
          const res = await fetch('/api/map/world-status');
          worldAvailable = (await res.json()).available;
        } catch (e) {
          worldAvailable = false;
        }
        checkingMsg.classList.add('hidden');
        if (!worldAvailable) {
          unavailableWarning.classList.remove('hidden');
          return;
        }
        // The map container must be visible before MapLibre initialises, or it measures zero-size
        mapFields.classList.remove('hidden');

        // Restore whatever was picked earlier; otherwise seed a box centered on the station position
        let initialBounds = null;
        if (m.north !== undefined && m.south !== undefined && m.east !== undefined && m.west !== undefined) {
          initialBounds = {
            north: parseFloat(m.north), south: parseFloat(m.south),
            east: parseFloat(m.east), west: parseFloat(m.west),
          };
        } else {
          let initLat = NaN, initLon = NaN;
          const g = wizardData.gps || {};
          if (g.position_source === 'manual' && g.latitude && g.longitude) {
            initLat = parseFloat(g.latitude);
            initLon = parseFloat(g.longitude);
          } else {
            try {
              const res = await fetch('/api/gps/position');
              const data = await res.json();
              if (data.available) {
                initLat = data.latitude;
                initLon = data.longitude;
              }
            } catch (e) {
              // Falls through to the 0,0 default below.
            }
          }
          if (!Number.isFinite(initLat) || !Number.isFinite(initLon)) {
            initLat = 0;
            initLon = 0;
          }
          initialBounds = boundsFromRadius(initLat, initLon, MAP_DEFAULT_RADIUS_KM);
        }

        await initRegionMap(initialBounds);

        // Only downloading/editing the region needs a live connection; viewing the cached map doesn't
        let online = false;
        try {
          const res = await fetch('/api/network/internet');
          online = (await res.json()).online;
        } catch (e) {
          online = false;
        }
        setInteractive(online);
      })();
    }

    function saveMapStep() {
      if (!mapRegionBounds) {
        // Merge onto wizardData.map so Finish step's auto-update settings survive
        wizardData.map = wizardData.map || {};
        return true;
      }
      wizardData.map = {
        ...wizardData.map,
        ...mapRegionBounds,
        zoom_max: document.getElementById('map-zoom-max').value,
      };
      return true;
    }

    // ── User management step ─────────────────────────────────────────
    // Three security levels; password is hashed (PBKDF2, services/auth.py) before touching disk
    const USER_SECURITY_MODES = [
      { value: 'none', label: 'No security' },
      { value: 'readonly', label: 'Read only' },
      { value: 'full', label: 'Full security' },
    ];

    function renderUserStep() {
      const u = wizardData.user || {};
      document.getElementById('step-content').innerHTML = `
        <section>
          <div class="field">
            <label for="user-security-mode">Security mode ${helpIcon('<ul style="margin: 0; padding-left: 18px;"><li><strong>No security:</strong> open access, no password.</li><li><strong>Read only:</strong> viewing is open, any change needs the password.</li><li><strong>Full security:</strong> the password is needed for everything, including just viewing.</li></ul>')}</label>
            <select id="user-security-mode">
              ${USER_SECURITY_MODES.map(m => `<option value="${m.value}">${m.label}</option>`).join('')}
            </select>
          </div>
          <div class="field hidden" id="user-password-field">
            <label for="user-password">Admin password</label>
            <input type="password" id="user-password" placeholder="At least 8 characters" autocomplete="new-password">
          </div>
          <div class="field hidden" id="user-password-confirm-field">
            <label for="user-password-confirm">Confirm admin password</label>
            <input type="password" id="user-password-confirm" placeholder="Re-enter the password" autocomplete="new-password">
          </div>
          <p class="msg" id="user-msg"></p>
        </section>
      `;

      const modeSelect = document.getElementById('user-security-mode');
      const passwordField = document.getElementById('user-password-field');
      const confirmField = document.getElementById('user-password-confirm-field');
      const passwordInput = document.getElementById('user-password');
      const confirmInput = document.getElementById('user-password-confirm');
      const msg = document.getElementById('user-msg');
      const nextBtn = document.getElementById('btn-next');
      modeSelect.value = u.mode || 'none';
      // Restore anything entered earlier this session
      if (u.password) {
        passwordInput.value = u.password;
        confirmInput.value = u.password;
      }

      // Next stays disabled until the password is valid, so saveUserStep() can't be reached invalid
      function updateState() {
        const needsPassword = modeSelect.value !== 'none';
        passwordField.classList.toggle('hidden', !needsPassword);
        confirmField.classList.toggle('hidden', !needsPassword);

        if (!needsPassword) {
          msg.textContent = '';
          msg.className = 'msg';
          nextBtn.disabled = false;
          return;
        }

        const password = passwordInput.value;
        const confirm = confirmInput.value;
        if (password && password.length < 8) {
          msg.textContent = 'Password must be at least 8 characters.';
          msg.className = 'msg error';
        } else if (confirm && confirm !== password) {
          msg.textContent = "Passwords don't match.";
          msg.className = 'msg error';
        } else {
          msg.textContent = '';
          msg.className = 'msg';
        }
        nextBtn.disabled = !(password.length >= 8 && confirm === password);
      }

      modeSelect.addEventListener('change', updateState);
      passwordInput.addEventListener('input', updateState);
      confirmInput.addEventListener('input', updateState);
      updateState();
    }

    function saveUserStep() {
      const mode = document.getElementById('user-security-mode').value;
      wizardData.user = mode === 'none'
        ? { mode }
        : { mode, password: document.getElementById('user-password').value };
      return true;
    }

    // ── E-Ink display step ───────────────────────────────────────────
    // Written straight to display_config.json; page-rotation list feeds display/rotation.py directly
    const EINK_DEFAULT_PAGES = [
      { id: 'status', label: 'Status' },
      { id: 'config_summary', label: 'Config summary' },
      { id: 'location', label: 'Location' },
      { id: 'symbol', label: 'Symbol & comment' },
      { id: 'last_beacon', label: 'Last beacon' },
      { id: 'last_heard', label: 'Last heard' },
    ];
    const EINK_DEFAULT_DURATION_S = 30;
    let einkPages = [];

    function renderEinkPageLists() {
      const enabledList = document.getElementById('eink-enabled-list');
      const disabledList = document.getElementById('eink-disabled-list');
      const enabled = einkPages.filter(p => p.enabled);
      const disabled = einkPages.filter(p => !p.enabled);

      enabledList.innerHTML = enabled.map((p, i) => `
        <div class="eink-page-row">
          <div class="eink-page-info"><strong>${p.label}</strong></div>
          <div class="field-suffix" style="flex: 0 0 100px;">
            <input type="number" min="1" class="eink-duration" data-id="${p.id}" value="${p.duration}">
            <span>sec</span>
          </div>
          <div class="eink-page-actions">
            <button type="button" class="eink-move-up" data-id="${p.id}" ${i === 0 ? 'disabled' : ''} title="Move up">&uarr;</button>
            <button type="button" class="eink-move-down" data-id="${p.id}" ${i === enabled.length - 1 ? 'disabled' : ''} title="Move down">&darr;</button>
            <button type="button" class="eink-disable" data-id="${p.id}">Disable</button>
          </div>
        </div>
      `).join('') || '<p class="hint">Nothing enabled: every screen is disabled below.</p>';

      disabledList.innerHTML = disabled.map(p => `
        <div class="eink-page-row disabled">
          <div class="eink-page-info"><strong>${p.label}</strong></div>
          <div class="eink-page-actions">
            <button type="button" class="eink-enable" data-id="${p.id}">Enable</button>
          </div>
        </div>
      `).join('') || '<p class="hint">Nothing disabled.</p>';

      enabledList.querySelectorAll('.eink-move-up').forEach(btn =>
        btn.addEventListener('click', () => moveEinkPage(btn.dataset.id, -1)));
      enabledList.querySelectorAll('.eink-move-down').forEach(btn =>
        btn.addEventListener('click', () => moveEinkPage(btn.dataset.id, 1)));
      enabledList.querySelectorAll('.eink-disable').forEach(btn =>
        btn.addEventListener('click', () => setEinkPageEnabled(btn.dataset.id, false)));
      disabledList.querySelectorAll('.eink-enable').forEach(btn =>
        btn.addEventListener('click', () => setEinkPageEnabled(btn.dataset.id, true)));
      enabledList.querySelectorAll('.eink-duration').forEach(input =>
        input.addEventListener('input', () => {
          const page = einkPages.find(p => p.id === input.dataset.id);
          if (page) page.duration = input.value;
        }));
    }

    // Swaps the two enabled pages, ignoring disabled pages interspersed between them
    function moveEinkPage(id, delta) {
      const enabledIds = einkPages.filter(p => p.enabled).map(p => p.id);
      const from = enabledIds.indexOf(id);
      const to = from + delta;
      if (from === -1 || to < 0 || to >= enabledIds.length) return;
      const fromIdx = einkPages.findIndex(p => p.id === id);
      const toIdx = einkPages.findIndex(p => p.id === enabledIds[to]);
      [einkPages[fromIdx], einkPages[toIdx]] = [einkPages[toIdx], einkPages[fromIdx]];
      renderEinkPageLists();
    }

    // Re-enabling always appends to the end of the rotation rather than restoring its old position
    function setEinkPageEnabled(id, enabled) {
      const idx = einkPages.findIndex(p => p.id === id);
      if (idx === -1) return;
      const [page] = einkPages.splice(idx, 1);
      page.enabled = enabled;
      einkPages.push(page);
      renderEinkPageLists();
    }

    async function renderEinkStep() {
      const d = wizardData.display || {};
      document.getElementById('step-content').innerHTML = `
        <section>
          <div class="field">
            <label for="eink-display">Display</label>
            <select id="eink-display"></select>
          </div>

          <div class="field">
            <label>Screens</label>
            <div id="eink-enabled-list"></div>

            <label style="margin-top: 20px; display: block;">Disabled</label>
            <div id="eink-disabled-list"></div>
          </div>
        </section>
      `;

      einkPages = (d.pages && d.pages.length ? d.pages : EINK_DEFAULT_PAGES.map(p => ({ ...p, duration: EINK_DEFAULT_DURATION_S, enabled: true })))
        .map(p => ({ ...EINK_DEFAULT_PAGES.find(dp => dp.id === p.id), ...p }));
      renderEinkPageLists();

      const select = document.getElementById('eink-display');
      addOption(select, 'none|', 'None (disabled)');
      try {
        const res = await fetch('/api/display/models');
        const data = await res.json();
        (data.models || []).forEach(m => addOption(select, `waveshare|${m.id}`, m.desc));
      } catch (e) {
        // "None" still works without this
      }

      // Preset to whatever was picked this session, else install.sh's config, else "None"
      if (d.driver !== undefined) {
        select.value = `${d.driver}|${d.model || ''}`;
      } else {
        try {
          const res = await fetch('/api/display/config');
          const data = await res.json();
          select.value = `${data.driver || 'none'}|${data.model || ''}`;
        } catch (e) {
          select.value = 'none|';
        }
      }
    }

    function saveEinkStep() {
      const [driver, model] = document.getElementById('eink-display').value.split('|');
      wizardData.display = {
        driver,
        model,
        pages: einkPages.map(({ id, duration, enabled }) => ({ id, duration, enabled })),
      };
      return true;
    }

    // ── Startup step ─────────────────────────────────────────────────
    const STARTUP_DEFAULT_RESTART_ATTEMPTS = 3;
    const STARTUP_DEFAULT_RESTART_DELAY_S = 30;

    async function renderStartupStep() {
      const s = wizardData.startup || {};
      const m = wizardData.map || {};
      document.getElementById('step-content').innerHTML = `
        <section>
          <div class="field">
            <label class="subsection-title">
              <input type="checkbox" id="startup-autostart" checked>
              Start automatically on boot
              ${helpIcon("Recommended for a field-deployed station: if the power drops and comes back, or the Pi reboots on its own, it starts digipeating again without anyone needing to log in and start it by hand.")}
            </label>
          </div>

          <div class="field">
            <label class="subsection-title">
              <input type="checkbox" id="startup-autorestart" checked>
              Restart automatically if it crashes
              ${helpIcon("If Direwolf exits unexpectedly (not a normal shutdown), try restarting it rather than leaving the station silent until someone notices.")}
            </label>
          </div>
          <div class="field-row" id="startup-restart-fields">
            <div class="field">
              <label for="startup-restart-attempts">Max attempts</label>
              <input type="number" id="startup-restart-attempts" min="1" value="${s.restart_attempts ?? STARTUP_DEFAULT_RESTART_ATTEMPTS}">
            </div>
            <div class="field">
              <label for="startup-restart-delay">Delay between attempts</label>
              <div class="field-suffix"><input type="number" id="startup-restart-delay" min="1" value="${s.restart_delay_s ?? STARTUP_DEFAULT_RESTART_DELAY_S}"><span>sec</span></div>
            </div>
          </div>

          <div class="field">
            <label class="subsection-title">
              <input type="checkbox" id="map-auto-update-enabled">
              Automatically check for map updates
              ${helpIcon("Runs in the background from now on, not just during setup. Once a day it checks whether Protomaps has published a newer map build than what's cached, and if so, re-downloads the world map and (if a region was picked on the Map caching step) that region too. Needs internet at check time; if there isn't any, it just tries again at the next check rather than waiting a full day.")}
            </label>
          </div>
          <div class="field" id="map-auto-update-time-wrap">
            <label for="map-auto-update-time">Check time</label>
            <input type="time" id="map-auto-update-time" value="${(m.auto_update && m.auto_update.time) || MAP_DEFAULT_AUTO_UPDATE_TIME}">
          </div>
        </section>
      `;

      const autostartBox = document.getElementById('startup-autostart');
      const autorestartBox = document.getElementById('startup-autorestart');
      const restartFields = document.getElementById('startup-restart-fields');

      autostartBox.checked = s.autostart ?? true;
      autorestartBox.checked = s.autorestart ?? true;

      function updateRestartFieldsVisibility() {
        restartFields.classList.toggle('hidden', !autorestartBox.checked);
      }
      autorestartBox.addEventListener('change', updateRestartFieldsVisibility);
      updateRestartFieldsVisibility();

      const autoUpdateCheckbox = document.getElementById('map-auto-update-enabled');
      const autoUpdateTimeWrap = document.getElementById('map-auto-update-time-wrap');
      function updateAutoUpdateTimeVisibility() {
        autoUpdateTimeWrap.classList.toggle('hidden', !autoUpdateCheckbox.checked);
      }
      autoUpdateCheckbox.addEventListener('change', updateAutoUpdateTimeVisibility);

      if (m.auto_update && typeof m.auto_update.enabled === 'boolean') {
        // An existing value always wins over re-deriving a default
        autoUpdateCheckbox.checked = m.auto_update.enabled;
      } else {
        // No saved preference: default on only if there's internet right now
        try {
          const res = await fetch('/api/network/internet');
          autoUpdateCheckbox.checked = (await res.json()).online;
        } catch (e) {
          autoUpdateCheckbox.checked = false;
        }
      }
      updateAutoUpdateTimeVisibility();
    }

    function saveStartupStep() {
      const autorestart = document.getElementById('startup-autorestart').checked;
      wizardData.startup = {
        autostart: document.getElementById('startup-autostart').checked,
        autorestart,
      };
      if (autorestart) {
        wizardData.startup.restart_attempts = document.getElementById('startup-restart-attempts').value;
        wizardData.startup.restart_delay_s = document.getElementById('startup-restart-delay').value;
      }
      // Merged onto wizardData.map so Map caching's own fields aren't overwritten
      wizardData.map = {
        ...wizardData.map,
        auto_update: {
          enabled: document.getElementById('map-auto-update-enabled').checked,
          time: document.getElementById('map-auto-update-time').value || MAP_DEFAULT_AUTO_UPDATE_TIME,
        },
      };
      return true;
    }

    // ── Finish step ───────────────────────────────────────────────────
    const REBOOT_WAIT_S = 60;

    async function renderFinishStep() {
      document.getElementById('step-content').innerHTML = `
        <section>
          <p>That's everything needed for now. Press <strong>Finish &amp; Reboot</strong> to save your settings. The device will reboot and start up in standard mode.</p>
          <p class="hint">This page will automatically reload into the dashboard once it's back up.</p>
          <div id="finish-download-progress" class="hidden">
            <p class="hint">A map region download is still running in the background: <strong>Finish &amp; Reboot</strong> is disabled until it's done, since rebooting partway through would stop it with no way to resume afterward (this setup wizard only exists on first boot).</p>
            <div class="status-box" id="finish-download-progress-msg"></div>
          </div>

          <p class="msg" id="finish-msg"></p>
        </section>
      `;

      // Blocks Finish & Reboot while a region download is still active; best-effort, keeps polling on failure
      const downloadProgressWrap = document.getElementById('finish-download-progress');
      const downloadProgressMsg = document.getElementById('finish-download-progress-msg');
      const nextBtn = document.getElementById('btn-next');

      async function pollFinishDownloadStatus() {
        let data;
        try {
          const res = await fetch('/api/map/cache/status');
          data = await res.json();
        } catch (e) {
          return true; // unknown, keep polling, don't change button state
        }
        if (!data.active) {
          downloadProgressWrap.classList.add('hidden');
          nextBtn.disabled = false;
          return false;
        }
        downloadProgressWrap.classList.remove('hidden');
        nextBtn.disabled = true;
        const elapsed = data.elapsed_s !== null ? formatDuration(data.elapsed_s) : '';
        downloadProgressMsg.textContent = `Downloading… ${formatBytes(data.bytes)} so far${elapsed ? ` (${elapsed} elapsed)` : ''}`;
        return true;
      }

      const stillActive = await pollFinishDownloadStatus();
      if (stillActive) {
        mapStatusPollTimer = setInterval(async () => {
          if (!(await pollFinishDownloadStatus())) {
            clearInterval(mapStatusPollTimer);
            mapStatusPollTimer = null;
          }
        }, 1000);
      }
    }

    function startRebootCountdown() {
      const msg = document.getElementById('finish-msg');
      let remaining = REBOOT_WAIT_S;
      const tick = () => {
        if (remaining <= 0) {
          msg.textContent = 'Reconnecting…';
          window.location.reload();
          return;
        }
        msg.textContent = `Settings saved. Rebooting. Reloading in ${remaining}s…`;
        remaining--;
        setTimeout(tick, 1000);
      };
      tick();
    }

    async function finishSetup() {
      const nextBtn = document.getElementById('btn-next');
      const backBtn = document.getElementById('btn-back');
      const msg = document.getElementById('finish-msg');
      nextBtn.disabled = true;
      backBtn.disabled = true;
      nextBtn.textContent = 'Rebooting…';
      msg.className = 'msg';
      try {
        const res = await fetch('/api/setup/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(wizardData),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || res.statusText);
        }
        msg.className = 'msg success';
        startRebootCountdown();
      } catch (e) {
        msg.textContent = `Error: ${e.message}`;
        msg.className = 'msg error';
        nextBtn.disabled = false;
        backBtn.disabled = false;
        nextBtn.textContent = 'Finish & Reboot';
      }
      return false; // this step never advances further: it's terminal
    }

    // ── Pager ──────────────────────────────────────────────────────────
    document.getElementById('btn-back').addEventListener('click', () => {
      if (currentStep > 0) {
        currentStep--;
        showStep();
      }
    });

    document.getElementById('btn-next').addEventListener('click', async () => {
      const step = steps[currentStep];
      const ok = await step.onNext();
      if (!ok) return;
      if (currentStep < steps.length - 1) {
        currentStep++;
        showStep();
      }
    });

    showStep();
  </script>
</body>
</html>
